<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WFS-Karte · Streetshots Inspector</title>
    <link rel="icon" href="./streetshots-road.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <link rel="stylesheet" href="./sign-feed.css" />
    <script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script defer src="./traffic-sign-inventory.js"></script>
    <script defer src="./map-tiles.js"></script>
    <script defer src="./sign-feed.js"></script>
  </head>
  <body>
    <header>
      <a class="feed-back" href="./#place-signs">Streetshots Inspector</a>
      <label>Gemeinde
        <select id="feed-city">
          <option value="bad-herrenalb">Bad Herrenalb</option>
          <option value="pforzheim">Pforzheim</option>
        </select>
      </label>
      <a id="feed-source">WFS · GeoJSON</a>
      <a href="./route-review.html">Fahrtvergleich</a>
      <span id="feed-status" role="status"></span>
    </header>
    <main id="feed-map" aria-label="Verkehrszeichen mit Azimut auf der Karte"></main>
    <aside class="feed-legend" aria-label="Kartenlegende">
      <strong>Kartenlegende</strong>
      <span><img class="feed-legend-sign" src="../shared/tsr/sign-pictograms/png/de-205.png" alt=""> Piktogramm · ermittelte Zeichenklasse</span>
      <span><b class="feed-legend-question">?</b> Beispielpiktogramm · Wert oder Variante offen</span>
      <span><b class="feed-legend-code">DE:…</b> Klassencode ohne Piktogramm</span>
      <span>Drehung des Piktogramms · Ausrichtung im Uhrzeigersinn ab Nord</span>
    </aside>
  </body>
</html>
