name: Karlsruhe Incremental Bundle Build And Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag for Karlsruhe bundle assets"
        required: false
        default: "karlsruhe-regbez"
        type: string
      pbf_release_tag:
        description: "Release tag containing Karlsruhe PBF snapshot assets"
        required: false
        default: "karlsruhe-regbez-pbf"
        type: string
      bundle_version:
        description: "Optional bundle version override (YYYY-MM-DD). Empty uses PBF report timestamp."
        required: false
        default: ""
        type: string
      max_geom_points:
        description: "Max sampled geometry points for preprocessing"
        required: false
        default: "8"
        type: string
      force_publish:
        description: "Force full rebuild/release even when no diff change was detected"
        required: false
        default: false
        type: boolean
  workflow_run:
    workflows:
      - Karlsruhe PBF Diff Update And Release
    types:
      - completed

permissions:
  contents: write

concurrency:
  group: karlsruhe-incremental-bundle-release
  cancel-in-progress: false

jobs:
  build-release:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      REGION: karlsruhe-regbez
      DEFAULT_RELEASE_TAG: karlsruhe-regbez
      DEFAULT_PBF_RELEASE_TAG: karlsruhe-regbez-pbf
      INPUT_PBF: mapdata/raw/karlsruhe-regbez-latest.osm.pbf
      PBF_ASSET_NAME: karlsruhe-regbez-latest.osm.pbf
      PBF_PARTS_META_ASSET: karlsruhe-regbez-latest.osm.pbf.parts.json
      STATE_ASSET_NAME: karlsruhe-regbez.diff_state.json
      REPORT_ASSET_NAME: diff_update.karlsruhe-regbez.latest.json
      REPORT_FILE: mapdata/reports/diff_update.karlsruhe-regbez.latest.json
      DAILY_DIR: mapdata/reports/deltas/daily
      BUNDLE_DIR: mapdata/bundles/v3/karlsruhe-regbez/latest
      BUNDLE_DB_ASSET: karlsruhe-regbez_speeds.sqlite
      BUNDLE_MANIFEST_ASSET: karlsruhe-regbez_manifest.json
      DELTA_INDEX_ASSET: karlsruhe-regbez_delta_index.json
      RETENTION_UPDATES: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install osmium
          chmod +x scripts/map/build_region_artifacts.sh
          chmod +x scripts/map/publish_v3_release_assets.sh

      - name: Resolve Parameters
        id: params
        run: |
          release_tag="${{ github.event.inputs.release_tag || '' }}"
          if [[ -z "${release_tag}" ]]; then
            release_tag="${DEFAULT_RELEASE_TAG}"
          fi

          pbf_release_tag="${{ github.event.inputs.pbf_release_tag || '' }}"
          if [[ -z "${pbf_release_tag}" ]]; then
            pbf_release_tag="${DEFAULT_PBF_RELEASE_TAG}"
          fi

          bundle_version="${{ github.event.inputs.bundle_version || '' }}"
          max_geom_points="${{ github.event.inputs.max_geom_points || '' }}"
          if [[ -z "${max_geom_points}" ]]; then
            max_geom_points="8"
          fi

          force_publish="${{ github.event.inputs.force_publish || 'false' }}"
          if [[ "${force_publish}" == "true" ]]; then
            force_publish=1
          else
            force_publish=0
          fi

          {
            echo "release_tag=${release_tag}"
            echo "pbf_release_tag=${pbf_release_tag}"
            echo "bundle_version=${bundle_version}"
            echo "max_geom_points=${max_geom_points}"
            echo "force_publish=${force_publish}"
          } >> "${GITHUB_OUTPUT}"

      - name: Download Maintained Karlsruhe PBF Snapshot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          mkdir -p mapdata/raw mapdata/reports "${DAILY_DIR}"
          pbf_tag="${{ steps.params.outputs.pbf_release_tag }}"

          if ! gh release view "${pbf_tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Required PBF release not found: ${pbf_tag}" >&2
            exit 1
          fi

          gh release download "${pbf_tag}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "${PBF_ASSET_NAME}" \
            --pattern "${PBF_ASSET_NAME}.part*" \
            --pattern "${PBF_PARTS_META_ASSET}" \
            --pattern "${STATE_ASSET_NAME}" \
            --pattern "${REPORT_ASSET_NAME}" \
            --pattern "${REGION}-*.osc.gz" \
            --dir mapdata/raw \
            --clobber || true

          if [[ ! -f "${INPUT_PBF}" ]]; then
            parts=(mapdata/raw/${PBF_ASSET_NAME}.part*)
            if (( ${#parts[@]} > 0 )); then
              cat "${parts[@]}" > "${INPUT_PBF}"
            fi
          fi

          if [[ -f "mapdata/raw/${REPORT_ASSET_NAME}" ]]; then
            mv "mapdata/raw/${REPORT_ASSET_NAME}" "${REPORT_FILE}"
          fi
          deltas=(mapdata/raw/${REGION}-*.osc.gz)
          if (( ${#deltas[@]} > 0 )); then
            mv mapdata/raw/${REGION}-*.osc.gz "${DAILY_DIR}/"
          fi

          test -s "${INPUT_PBF}"
          test -f "${REPORT_FILE}"

      - name: Resolve Bundle Version And Daily Delta
        id: version
        run: |
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          override = os.environ.get("INPUT_BUNDLE_VERSION", "").strip()
          report_file = Path(os.environ["INPUT_REPORT_FILE"])
          region = os.environ["INPUT_REGION"]
          daily_dir = Path(os.environ["INPUT_DAILY_DIR"])

          payload = json.loads(report_file.read_text(encoding="utf-8"))
          pbf_after = payload.get("pbf_after", {}) if isinstance(payload, dict) else {}
          server_after = payload.get("server_state_after", {}) if isinstance(payload, dict) else {}
          delta_export = payload.get("delta_export", {}) if isinstance(payload, dict) else {}

          ts = pbf_after.get("timestamp") or server_after.get("timestamp")
          if not ts:
            ts = datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")

          bundle_version = override or str(ts)[:10]
          processed_date = str(ts)[:10]
          expected_delta_path = daily_dir / f"{region}-{processed_date}.osc.gz"
          delta_status = str(delta_export.get("status") or "")
          diff_changed = "1" if delta_status == "exported" and expected_delta_path.exists() else "0"

          out = Path(os.environ["GITHUB_OUTPUT"])
          with out.open("a", encoding="utf-8") as f:
            f.write(f"bundle_version={bundle_version}\n")
            f.write(f"processed_date={processed_date}\n")
            f.write(f"diff_changed={diff_changed}\n")
            f.write(f"delta_path={expected_delta_path if expected_delta_path.exists() else ''}\n")

          print(f"bundle_version={bundle_version}")
          print(f"processed_date={processed_date}")
          print(f"diff_changed={diff_changed}")
          print(f"delta_path={expected_delta_path if expected_delta_path.exists() else ''}")
          PY
        env:
          INPUT_BUNDLE_VERSION: ${{ steps.params.outputs.bundle_version }}
          INPUT_REPORT_FILE: ${{ env.REPORT_FILE }}
          INPUT_REGION: ${{ env.REGION }}
          INPUT_DAILY_DIR: ${{ env.DAILY_DIR }}

      - name: Fetch Previous Latest Bundle Metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/karlsruhe-prev
          release_tag="${{ steps.params.outputs.release_tag }}"

          if gh release view "${release_tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release download "${release_tag}" \
              --repo "${GITHUB_REPOSITORY}" \
              --pattern "${BUNDLE_MANIFEST_ASSET}" \
              --pattern "${DELTA_INDEX_ASSET}" \
              --dir /tmp/karlsruhe-prev \
              --clobber || true
          fi

      - name: Check Bundle Version Change
        id: compare
        run: |
          prev_manifest_tmp="/tmp/karlsruhe-prev/${BUNDLE_MANIFEST_ASSET}"
          new_version="${{ steps.version.outputs.bundle_version }}"
          diff_changed="${{ steps.version.outputs.diff_changed }}"
          force_publish="${{ steps.params.outputs.force_publish }}"

          if [[ "${force_publish}" == "1" ]]; then
            echo "needs_publish=1" >> "${GITHUB_OUTPUT}"
            echo "Force publish requested; continuing with build/release."
            exit 0
          fi

          if [[ ! -f "${prev_manifest_tmp}" ]]; then
            echo "needs_publish=1" >> "${GITHUB_OUTPUT}"
            echo "No previous bundle manifest found; publishing initial seed bundle."
            exit 0
          fi

          prev_version="$(python3 -c 'import json; from pathlib import Path; obj=json.loads(Path("'"${prev_manifest_tmp}"'").read_text(encoding="utf-8")); print(obj.get("bundle_version") or "")')"

          if [[ "${diff_changed}" != "1" && -n "${prev_version}" && "${prev_version}" == "${new_version}" ]]; then
            echo "needs_publish=0" >> "${GITHUB_OUTPUT}"
            echo "No daily diff change and bundle already up to date (${new_version}); skipping build/release."
            exit 0
          fi

          if [[ "${diff_changed}" != "1" ]]; then
            echo "needs_publish=0" >> "${GITHUB_OUTPUT}"
            echo "No daily diff change detected; skipping build/release."
            exit 0
          fi

          if [[ -n "${prev_version}" && "${prev_version}" == "${new_version}" ]]; then
            echo "needs_publish=0" >> "${GITHUB_OUTPUT}"
            echo "Bundle already published for version ${new_version}; skipping build/release."
            exit 0
          fi

          echo "needs_publish=1" >> "${GITHUB_OUTPUT}"

      - name: Build v1 Artifacts And DB
        if: steps.compare.outputs.needs_publish == '1'
        run: |
          scripts/map/build_region_artifacts.sh \
            --region "${REGION}" \
            --input "${INPUT_PBF}" \
            --engine pyosmium \
            --max-geom-points "${{ steps.params.outputs.max_geom_points }}"

          python3 scripts/map/build_spatialite_v3.py \
            --v1-dist "mapdata/dist/${REGION}" \
            --out-db "mapdata/dist-v3/${REGION}/speeds_v3.sqlite"

      - name: Regression Check (paper benchmark smoke contract)
        if: steps.compare.outputs.needs_publish == '1'
        run: |
          python3 scripts/map/validate_v3_release_regressions.py \
            --db "mapdata/dist-v3/${REGION}/speeds_v3.sqlite" \
            --probe-way-id "17721265" \
            --expected-maxspeed-kmh "30" \
            --probe-ref-way-id "1220097540" \
            --expected-ref "L 564" \
            --out-json "mapdata/reports/${REGION}-v3-release-regression.json"

      - name: Build New Incremental Delta (If Possible)
        if: steps.compare.outputs.needs_publish == '1'
        id: delta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "${BUNDLE_DIR}" /tmp/karlsruhe-prev/dbparts

          prev_manifest_tmp="/tmp/karlsruhe-prev/${BUNDLE_MANIFEST_ASSET}"
          prev_db_tmp="/tmp/karlsruhe-prev/previous_bundle.sqlite"
          rm -f "${prev_db_tmp}"
          new_delta_manifest=""
          new_delta_asset_path=""

          if [[ -f "${prev_manifest_tmp}" ]]; then
            prev_version="$(python3 -c 'import json; from pathlib import Path; obj=json.loads(Path("'"${prev_manifest_tmp}"'").read_text(encoding="utf-8")); print(obj.get("bundle_version") or "")')"
            new_version="${{ steps.version.outputs.bundle_version }}"

            if [[ -n "${prev_version}" && "${prev_version}" != "${new_version}" ]]; then
              prev_db_file="$(python3 -c 'import json; from pathlib import Path; obj=json.loads(Path("'"${prev_manifest_tmp}"'").read_text(encoding="utf-8")); print(((obj.get("db") or {}).get("file")) or "")')"
              python3 -c 'import json,sys; from pathlib import Path; payload=json.loads(Path(sys.argv[1]).read_text(encoding="utf-8")); [print(str(item.get("file") or "").strip()) for item in (payload.get("db_parts") or []) if isinstance(item, dict) and str(item.get("file") or "").strip()]' "${prev_manifest_tmp}" > /tmp/karlsruhe-prev/dbparts.txt

              if [[ -s /tmp/karlsruhe-prev/dbparts.txt ]]; then
                while IFS= read -r part_name; do
                  [[ -n "${part_name}" ]] || continue
                  gh release download "${{ steps.params.outputs.release_tag }}" \
                    --repo "${GITHUB_REPOSITORY}" \
                    --pattern "${part_name}" \
                    --dir /tmp/karlsruhe-prev/dbparts \
                    --clobber
                done < /tmp/karlsruhe-prev/dbparts.txt

                cat /tmp/karlsruhe-prev/dbparts/* > "${prev_db_tmp}"
              elif [[ -n "${prev_db_file}" ]]; then
                gh release download "${{ steps.params.outputs.release_tag }}" \
                  --repo "${GITHUB_REPOSITORY}" \
                  --pattern "${prev_db_file}" \
                  --dir /tmp/karlsruhe-prev \
                  --clobber
                cp "/tmp/karlsruhe-prev/${prev_db_file}" "${prev_db_tmp}"
              fi

              if [[ -s "${prev_db_tmp}" ]]; then
                delta_dir="${BUNDLE_DIR}/deltas/${prev_version}_to_${new_version}"
                patch_name="${REGION}_${new_version}.v3_patch_from_${prev_version}.sql"
                manifest_name="${REGION}_${new_version}.v3_delta_manifest_from_${prev_version}.json"
                delta_input="${{ steps.version.outputs.delta_path }}"
                if [[ -z "${delta_input}" || ! -f "${delta_input}" ]]; then
                  delta_input="/tmp/karlsruhe-prev/noop.osc"
                  cat > "${delta_input}" <<'OSC'
<osmChange version="0.6" generator="youspeed">
</osmChange>
OSC
                  echo "No exported daily OSC delta found; using no-op diff input for exact DB delta generation."
                fi

                python3 scripts/map/build_v3_delta_pack.py \
                  --base-db "${prev_db_tmp}" \
                  --target-db "mapdata/dist-v3/${REGION}/speeds_v3.sqlite" \
                  --diff-file "${delta_input}" \
                  --region "${REGION}" \
                  --from-version "${prev_version}" \
                  --to-version "${new_version}" \
                  --out-dir "${delta_dir}" \
                  --patch-file-name "${patch_name}" \
                  --manifest-name "${manifest_name}" \
                  --validate-on-copy \
                  --github-owner "${GITHUB_REPOSITORY%/*}" \
                  --github-repo "${GITHUB_REPOSITORY#*/}" \
                  --github-release-tag "${{ steps.params.outputs.release_tag }}"

                new_delta_manifest="${delta_dir}/${manifest_name}"
                new_delta_asset_path="${manifest_name}"
              fi
            fi
          fi

          {
            echo "new_delta_manifest=${new_delta_manifest}"
            echo "new_delta_asset_path=${new_delta_asset_path}"
          } >> "${GITHUB_OUTPUT}"

      - name: Roll Delta Index (Retain Latest 30 Incrementals)
        if: steps.compare.outputs.needs_publish == '1'
        run: |
          mkdir -p "${BUNDLE_DIR}"
          release_base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${{ steps.params.outputs.release_tag }}"
          existing_args=()
          if [[ -f "/tmp/karlsruhe-prev/${DELTA_INDEX_ASSET}" ]]; then
            existing_args=(--existing-index "/tmp/karlsruhe-prev/${DELTA_INDEX_ASSET}")
          fi

          new_args=()
          if [[ -n "${{ steps.delta.outputs.new_delta_manifest }}" ]]; then
            new_args=(
              --new-delta-manifest "${{ steps.delta.outputs.new_delta_manifest }}"
              --new-delta-manifest-asset-path "${{ steps.delta.outputs.new_delta_asset_path }}"
              --release-asset-base-url "${release_base}"
            )
          fi

          python3 scripts/map/roll_v3_delta_index.py \
            --output "${BUNDLE_DIR}/${DELTA_INDEX_ASSET}" \
            --retention-count "${RETENTION_UPDATES}" \
            "${existing_args[@]}" \
            "${new_args[@]}"

      - name: Publish Latest Full Bundle Manifest
        if: steps.compare.outputs.needs_publish == '1'
        run: |
          python3 scripts/map/publish_v3_bundle.py \
            --region "${REGION}" \
            --country-code "DEU" \
            --db "mapdata/dist-v3/${REGION}/speeds_v3.sqlite" \
            --bundle-version "${{ steps.version.outputs.bundle_version }}" \
            --bundle-dir-name latest \
            --out-root mapdata/bundles/v3 \
            --db-file-name "${BUNDLE_DB_ASSET}" \
            --manifest-name "${BUNDLE_MANIFEST_ASSET}" \
            --delta-index "${BUNDLE_DIR}/${DELTA_INDEX_ASSET}" \
            --delta-index-file-name "${DELTA_INDEX_ASSET}" \
            --github-owner "${GITHUB_REPOSITORY%/*}" \
            --github-repo "${GITHUB_REPOSITORY#*/}" \
            --github-release-tag "${{ steps.params.outputs.release_tag }}"

      - name: Upload Latest Bundle Assets To Release
        if: steps.compare.outputs.needs_publish == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./scripts/map/publish_v3_release_assets.sh \
            --repo "${GITHUB_REPOSITORY}" \
            --tag "${{ steps.params.outputs.release_tag }}" \
            --bundle-dir "${BUNDLE_DIR}" \
            --title "Karlsruhe Regbez YouSpeed Data"

      - name: Prune Old Incremental Assets Beyond Retention
        if: steps.compare.outputs.needs_publish == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/map/prune_v3_release_assets.py \
            --repo "${GITHUB_REPOSITORY}" \
            --release-tag "${{ steps.params.outputs.release_tag }}" \
            --delta-index "${BUNDLE_DIR}/${DELTA_INDEX_ASSET}" \
            --bundle-manifest "${BUNDLE_DIR}/${BUNDLE_MANIFEST_ASSET}" \
            --bundle-manifest-name "${BUNDLE_MANIFEST_ASSET}" \
            --delta-index-name "${DELTA_INDEX_ASSET}" \
            --db-file-name "${BUNDLE_DB_ASSET}" \
            --delta-manifest-prefix "${REGION}_" \
            --patch-prefix "${REGION}_"
