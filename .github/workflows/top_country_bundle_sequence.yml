name: Top Country Delta Sequence

on:
  workflow_dispatch:
    inputs:
      countries:
        description: "Optional comma-separated country ids; full refresh also accepts region ids"
        required: false
        default: ""
        type: string
      ref:
        description: "Git ref to dispatch"
        required: false
        default: "main"
        type: string
      cooldown_sec:
        description: "Cooldown between workflow runs in seconds"
        required: false
        default: "120"
        type: string
      skip_pbf_step:
        description: "Skip the country PBF snapshot workflow"
        required: false
        default: false
        type: boolean
      skip_bundle_step:
        description: "Skip the country bundle workflow"
        required: false
        default: false
        type: boolean
      settlement_context_countries:
        description: "Optional comma-separated country ids that need settlement context"
        required: false
        default: "switzerland"
        type: string
      force_publish:
        description: "Force a full bundle rebuild and publication for every selected country"
        required: false
        default: false
        type: boolean
      full_refresh:
        description: "Rebuild and publish all app regions and Karlsruhe from fresh PBFs at this workflow commit"
        required: false
        default: false
        type: boolean
      bundle_version:
        description: "Full refresh version override; empty uses UTC date and workflow run id/attempt"
        required: false
        default: ""
        type: string
      packed_refresh:
        description: "Build draft packed releases from pinned sources; countries selects exact source release tags"
        required: false
        default: false
        type: boolean

permissions:
  actions: write
  contents: read

concurrency:
  group: ${{ inputs.packed_refresh && format('packed-runtime-{0}', inputs.countries || 'all') || 'top-country-delta-sequence' }}
  cancel-in-progress: false

jobs:
  dispatch:
    if: ${{ !inputs.full_refresh && !inputs.packed_refresh }}
    runs-on: ubuntu-latest
    timeout-minutes: 480
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Sequential Country Dispatcher
        run: |
          set -euo pipefail
          chmod +x scripts/map/run_country_bundle_sequence.sh

          ref_input="${{ github.event.inputs.ref || '' }}"
          if [[ -z "${ref_input}" ]]; then
            ref_input="${{ github.event.repository.default_branch }}"
          fi

          cmd=(
            ./scripts/map/run_country_bundle_sequence.sh
            --ref "${ref_input}"
            --cooldown-sec "${{ github.event.inputs.cooldown_sec || '120' }}"
          )

          if [[ -n "${{ github.event.inputs.countries || '' }}" ]]; then
            cmd+=(--countries "${{ github.event.inputs.countries }}")
          fi

          if [[ "${{ github.event.inputs.skip_pbf_step || 'false' }}" == "true" ]]; then
            cmd+=(--skip-pbf-step)
          fi

          if [[ "${{ github.event.inputs.skip_bundle_step || 'false' }}" == "true" ]]; then
            cmd+=(--skip-bundle-step)
          fi

          if [[ -n "${{ github.event.inputs.settlement_context_countries || '' }}" ]]; then
            cmd+=(--settlement-context-countries "${{ github.event.inputs.settlement_context_countries }}")
          fi

          if [[ "${{ github.event.inputs.force_publish || 'false' }}" == "true" ]]; then
            cmd+=(--force-publish true)
          fi

          "${cmd[@]}"

  plan-refresh:
    if: ${{ inputs.full_refresh && !inputs.packed_refresh }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      targets: ${{ steps.plan.outputs.targets }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Resolve full refresh targets
        id: plan
        env:
          TARGET_OVERRIDE: ${{ inputs.countries }}
          VERSION_OVERRIDE: ${{ inputs.bundle_version }}
        run: |
          python3 scripts/map/plan_full_bundle_refresh.py \
            --countries "$TARGET_OVERRIDE" \
            --bundle-version "$VERSION_OVERRIDE" \
            --github-output "$GITHUB_OUTPUT"

  refresh-region:
    needs: plan-refresh
    if: ${{ inputs.full_refresh && !inputs.packed_refresh }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
    concurrency:
      group: country-incremental-bundle-${{ matrix.target }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        target: ${{ fromJson(needs.plan-refresh.outputs.targets) }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PYTHONUNBUFFERED: "1"
      TARGET: ${{ matrix.target }}
      BUNDLE_VERSION: ${{ needs.plan-refresh.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          docker image prune -af >/dev/null 2>&1 || true
          df -h
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build dependencies
        run: python3 -m pip install -r scripts/map/requirements-settlement.txt
      - name: Rebuild, validate and release full bundle
        run: |
          python3 scripts/map/rebuild_release_bundle.py \
            --target "$TARGET" \
            --bundle-version "$BUNDLE_VERSION" \
            --source-commit "$GITHUB_SHA" \
            --repo "$GITHUB_REPOSITORY"
      - name: Retain refresh validation and provenance
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: bundle-refresh-${{ matrix.target }}-${{ github.sha }}
          path: mapdata/reports/full-refresh/${{ matrix.target }}/
          if-no-files-found: warn
          retention-days: 30

  packed-plan:
    if: ${{ inputs.packed_refresh }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      targets: ${{ steps.plan.outputs.targets }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Select pinned packed source releases
        id: plan
        env:
          TARGET_OVERRIDE: ${{ inputs.countries }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import re

          plan = json.loads(Path("shared/packed-runtime/releases/source-plan-2026-10-27.json").read_text())
          assert plan["format"] == "youspeed.v4.pinned-release-plan" and plan["schema_version"] == 1, "Unsupported pinned plan"
          assert not plan["failures"] and len(plan["bundles"]) == 55, "Pinned source plan is incomplete"
          entries = [entry for entry in plan["bundles"] if entry["region"] != "baden-wuerttemberg"]
          targets = [entry["source_release_tag"] for entry in entries]
          assert len(targets) == 54 and len(set(targets)) == len(targets), "Duplicate or missing packed targets"
          assert all(re.fullmatch(r"[a-z0-9][a-z0-9._-]*", tag) for tag in targets), "Unsafe packed target"
          assert all(isinstance(entry.get("source_manifest_document"), dict) for entry in entries), "Pinned manifest document missing"
          override = os.environ.get("TARGET_OVERRIDE", "").strip()
          if override:
              selected = [value.strip() for value in override.split(",")]
              assert all(selected) and len(set(selected)) == len(selected), "Use unique comma-separated source release tags"
              assert set(selected) <= set(targets), "Unknown source release tag (full BW is built separately): " + ",".join(sorted(set(selected) - set(targets)))
              targets = [tag for tag in targets if tag in selected]
          assert targets, "No packed sources selected"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("targets=" + json.dumps(targets, separators=(",", ":")) + "\n")
          print("Selected", len(targets), "pinned source releases; full BW is built separately")
          PY

  packed-build:
    needs: packed-plan
    if: ${{ inputs.packed_refresh }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
    concurrency:
      group: packed-bundle-${{ matrix.target }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        target: ${{ fromJson(needs.packed-plan.outputs.targets) }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PYTHONUNBUFFERED: "1"
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          docker image prune -af >/dev/null 2>&1 || true
          df -h
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install packed build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libzstd1
          python3 -m pip install osmium==4.3.0
      - name: Test packed release codecs, source fidelity and generic nodes
        run: python3 -m unittest discover -s tests/map -p 'test_packed*.py' -v
      - name: Build and verify pinned packed generation
        run: |
          set -euo pipefail
          mkdir -p "mapdata/build/packed-rollout/$TARGET"
          if [[ "$TARGET" == "deu-v3-data-karlsruhe-latest" ]]; then
            python3 scripts/map/refresh_packed_alias.py \
              --plan shared/packed-runtime/releases/source-plan-2026-10-27.json \
              --workspace mapdata/build/packed-rollout \
              --target "$TARGET" \
              2>&1 | tee "mapdata/build/packed-rollout/$TARGET/build.log"
          else
            python3 scripts/map/build_packed_release.py \
              --plan shared/packed-runtime/releases/source-plan-2026-10-27.json \
              --workspace mapdata/build/packed-rollout \
              --target "$TARGET" \
              --published-source-only \
              2>&1 | tee "mapdata/build/packed-rollout/$TARGET/build.log"
          fi
      - name: Stage verified draft release
        run: |
          set -euo pipefail
          python3 scripts/map/publish_packed_release.py \
            --result "mapdata/build/packed-rollout/$TARGET/result.json" \
            --source-commit "$GITHUB_SHA" \
            --repo "$GITHUB_REPOSITORY" \
            2>&1 | tee -a "mapdata/build/packed-rollout/$TARGET/build.log"
      - name: Retain small packed validation and draft receipts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: packed-draft-${{ matrix.target }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            mapdata/build/packed-rollout/${{ matrix.target }}/result.json
            mapdata/build/packed-rollout/${{ matrix.target }}/github-verified.json
            mapdata/build/packed-rollout/${{ matrix.target }}/build.log
          if-no-files-found: warn
          retention-days: 30
