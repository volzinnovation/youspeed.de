name: Karlsruhe V3 Bundle Build And Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag for Karlsruhe development bundle assets"
        required: false
        default: "deu-v3-data-karlsruhe-latest"
        type: string
      pbf_url:
        description: "Source OSM PBF URL"
        required: false
        default: "https://download.geofabrik.de/europe/germany/baden-wuerttemberg/karlsruhe-regbez-latest.osm.pbf"
        type: string
      bundle_version:
        description: "Optional bundle version override (YYYY-MM-DD). Empty uses current UTC date."
        required: false
        default: ""
        type: string
      max_geom_points:
        description: "Max sampled geometry points for preprocessing"
        required: false
        default: "8"
        type: string

permissions:
  contents: write

concurrency:
  group: karlsruhe-v3-bundle-release
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      REGION: karlsruhe-regbez
      INPUT_PBF: mapdata/raw/karlsruhe-regbez-latest.osm.pbf
      BUNDLE_DIR: mapdata/bundles/v3/karlsruhe-regbez/latest
      BUNDLE_DB_ASSET: DEU-latest.speeds_v3.sqlite
      BUNDLE_MANIFEST_ASSET: DEU-latest.bundle-manifest.v3.json
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install osmium
          chmod +x scripts/map/build_region_artifacts.sh
          chmod +x scripts/map/publish_v3_release_assets.sh

      - name: Resolve Parameters
        id: params
        run: |
          release_tag="${{ github.event.inputs.release_tag || '' }}"
          if [[ -z "${release_tag}" ]]; then
            release_tag="deu-v3-data-karlsruhe-latest"
          fi

          pbf_url="${{ github.event.inputs.pbf_url || '' }}"
          if [[ -z "${pbf_url}" ]]; then
            pbf_url="https://download.geofabrik.de/europe/germany/baden-wuerttemberg/karlsruhe-regbez-latest.osm.pbf"
          fi

          bundle_version="${{ github.event.inputs.bundle_version || '' }}"
          if [[ -z "${bundle_version}" ]]; then
            bundle_version="$(date -u +%Y-%m-%d)"
          fi

          max_geom_points="${{ github.event.inputs.max_geom_points || '' }}"
          if [[ -z "${max_geom_points}" ]]; then
            max_geom_points="8"
          fi

          {
            echo "release_tag=${release_tag}"
            echo "pbf_url=${pbf_url}"
            echo "bundle_version=${bundle_version}"
            echo "max_geom_points=${max_geom_points}"
          } >> "${GITHUB_OUTPUT}"

      - name: Download Karlsruhe PBF
        run: |
          mkdir -p mapdata/raw
          curl -L --fail --silent --show-error \
            "${{ steps.params.outputs.pbf_url }}" \
            -o "${INPUT_PBF}"
          test -s "${INPUT_PBF}"

      - name: Build v1 Artifacts And v3 DB
        run: |
          scripts/map/build_region_artifacts.sh \
            --region "${REGION}" \
            --input "${INPUT_PBF}" \
            --engine pyosmium \
            --max-geom-points "${{ steps.params.outputs.max_geom_points }}"

          python3 scripts/map/build_spatialite_v3.py \
            --v1-dist "mapdata/dist/${REGION}" \
            --out-db "mapdata/dist-v3/${REGION}/speeds_v3.sqlite"

      - name: Regression Check (way 17721265 maxspeed=30)
        run: |
          python3 - <<'PY'
          import re
          import sqlite3
          import sys

          db_path = "mapdata/dist-v3/karlsruhe-regbez/speeds_v3.sqlite"
          way_id = "17721265"
          expected_speed = 30

          conn = sqlite3.connect(db_path)
          try:
              row = conn.execute(
                  "SELECT way_id, maxspeed, maxspeed_type, source_maxspeed FROM ways WHERE way_id = ? LIMIT 1",
                  (way_id,),
              ).fetchone()
          finally:
              conn.close()

          if row is None:
              print(f"Regression check failed: way_id={way_id} not found in {db_path}", file=sys.stderr)
              sys.exit(1)

          _, maxspeed_raw, maxspeed_type, source_maxspeed = row
          maxspeed_text = (maxspeed_raw or "").strip()
          match = re.match(r"^\s*(\d{1,3})(?:\s*(?:km/?h))?\s*$", maxspeed_text, flags=re.IGNORECASE)
          parsed = int(match.group(1)) if match else None

          if parsed != expected_speed:
              print(
                  "Regression check failed: "
                  f"way_id={way_id} expected maxspeed={expected_speed} "
                  f"but got raw maxspeed={maxspeed_raw!r}, maxspeed_type={maxspeed_type!r}, source_maxspeed={source_maxspeed!r}",
                  file=sys.stderr,
              )
              sys.exit(1)

          print(f"Regression check passed: way_id={way_id} maxspeed={parsed}")
          PY

      - name: Regression Check (street/city/polygon query outputs)
        run: |
          python3 - <<'PY'
          import json
          import sqlite3
          import subprocess
          import sys

          db_path = "mapdata/dist-v3/karlsruhe-regbez/speeds_v3.sqlite"
          way_id = "17721265"
          row = None
          with sqlite3.connect(db_path) as conn:
              row = conn.execute(
                  "SELECT (min_lat + max_lat) / 2.0 AS lat, (min_lon + max_lon) / 2.0 AS lon FROM ways WHERE way_id = ? LIMIT 1",
                  (way_id,),
              ).fetchone()

          if row is None:
              print(f"Missing probe way_id={way_id} in {db_path}", file=sys.stderr)
              sys.exit(1)

          lat, lon = float(row[0]), float(row[1])
          cmd = [
              "python3",
              "scripts/map/query_speed_limit_v3.py",
              "--db",
              db_path,
              "--lat",
              str(lat),
              "--lon",
              str(lon),
              "--top-k",
              "1",
              "--distance-mode",
              "hybrid",
              "--polyline-top-n",
              "64",
          ]
          completed = subprocess.run(cmd, check=True, text=True, capture_output=True)
          payload = json.loads(completed.stdout)
          summary = payload.get("summary", {})

          if summary.get("has_street_name_column") is not True:
              print("Regression check failed: summary.has_street_name_column is false", file=sys.stderr)
              sys.exit(1)

          if "city_name" not in summary or "city_source" not in summary:
              print("Regression check failed: city_name/city_source missing in summary", file=sys.stderr)
              sys.exit(1)

          if payload.get("timing_ms", {}).get("city_resolve") is None:
              print("Regression check failed: timing_ms.city_resolve missing", file=sys.stderr)
              sys.exit(1)

          top = payload.get("top_candidates", [])
          if not top:
              print("Regression check failed: top_candidates empty", file=sys.stderr)
              sys.exit(1)
          if "street_name" not in top[0]:
              print("Regression check failed: top_candidates[0].street_name missing", file=sys.stderr)
              sys.exit(1)

          print(
              "Regression check passed: "
              f"way_id={way_id} street_name={top[0].get('street_name')!r} "
              f"city_name={summary.get('city_name')!r} city_source={summary.get('city_source')!r} "
              f"city_resolve_ms={payload.get('timing_ms', {}).get('city_resolve')}"
          )
          PY

      - name: Publish Bundle Manifest
        run: |
          python3 scripts/map/publish_v3_bundle.py \
            --region "${REGION}" \
            --db "mapdata/dist-v3/${REGION}/speeds_v3.sqlite" \
            --bundle-version "${{ steps.params.outputs.bundle_version }}" \
            --bundle-dir-name latest \
            --out-root mapdata/bundles/v3 \
            --db-file-name "${BUNDLE_DB_ASSET}" \
            --manifest-name "${BUNDLE_MANIFEST_ASSET}" \
            --github-owner "${GITHUB_REPOSITORY%/*}" \
            --github-repo "${GITHUB_REPOSITORY#*/}" \
            --github-release-tag "${{ steps.params.outputs.release_tag }}"

      - name: Upload Bundle Assets To Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./scripts/map/publish_v3_release_assets.sh \
            --repo "${GITHUB_REPOSITORY}" \
            --tag "${{ steps.params.outputs.release_tag }}" \
            --bundle-dir "${BUNDLE_DIR}" \
            --title "YouSpeed Karlsruhe v3 development bundle"
