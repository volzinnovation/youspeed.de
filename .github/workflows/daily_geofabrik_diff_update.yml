name: Germany PBF Diff Update And Release

on:
  schedule:
    # Run hourly; pipeline uses replication state.txt timestamp date to decide
    # whether a new daily diff should be processed.
    - cron: "35 * * * *"
  workflow_dispatch:
    inputs:
      pbf_release_tag:
        description: "Release tag for latest Germany PBF snapshot"
        required: false
        default: "deu-pbf-latest"
        type: string

permissions:
  contents: write

concurrency:
  group: geofabrik-daily-diff-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      DEFAULT_PBF_RELEASE_TAG: deu-pbf-latest
      ISO3: DEU
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore Cached Germany PBF
        id: pbf-cache-restore
        uses: actions/cache/restore@v4
        with:
          path: |
            mapdata/raw/DEU-latest.osm.pbf
            mapdata/raw/DEU.diff_state.json
          key: deu-pbf-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            deu-pbf-${{ runner.os }}-${{ github.ref_name }}-
            deu-pbf-${{ runner.os }}-

      - name: Resolve PBF Release Tag
        id: tags
        run: |
          pbf_tag="${{ github.event.inputs.pbf_release_tag || '' }}"
          if [[ -z "${pbf_tag}" ]]; then
            pbf_tag="${DEFAULT_PBF_RELEASE_TAG}"
          fi
          echo "pbf_release_tag=${pbf_tag}" >> "${GITHUB_OUTPUT}"
          echo "Using pbf release tag: ${pbf_tag}"

      - name: Bootstrap PBF From GitHub Release (Preferred)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          mkdir -p mapdata/raw mapdata/reports
          pbf_tag="${{ steps.tags.outputs.pbf_release_tag }}"
          if gh release view "${pbf_tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            # Preferred ISO3 naming
            gh release download "${pbf_tag}" \
              --repo "${GITHUB_REPOSITORY}" \
              --pattern "DEU-latest.osm.pbf" \
              --pattern "DEU-latest.osm.pbf.part*" \
              --pattern "DEU-latest.osm.pbf.parts.json" \
              --pattern "DEU.diff_state.json" \
              --pattern "diff_update.DEU.latest.json" \
              --dir mapdata/raw \
              --clobber || true

            if [[ ! -f mapdata/raw/DEU-latest.osm.pbf ]]; then
              parts=(mapdata/raw/DEU-latest.osm.pbf.part*)
              if (( ${#parts[@]} > 0 )); then
                cat "${parts[@]}" > mapdata/raw/DEU-latest.osm.pbf
              fi
            fi

            # Report belongs under mapdata/reports for downstream tooling
            if [[ -f mapdata/raw/diff_update.DEU.latest.json ]]; then
              mv mapdata/raw/diff_update.DEU.latest.json mapdata/reports/diff_update.DEU.latest.json
            fi
          fi

      - name: Check Seed Availability
        id: seed_check
        run: |
          if [[ -f mapdata/raw/DEU-latest.osm.pbf ]]; then
            echo "has_seed=1" >> "${GITHUB_OUTPUT}"
            echo "Seed PBF found. Daily diff pipeline is enabled."
          else
            echo "has_seed=0" >> "${GITHUB_OUTPUT}"
            echo "Seed PBF missing. Will create fresh seed snapshot first."
          fi

      - name: Ensure Latest Pipeline Scripts
        run: |
          git checkout -- scripts/map/update_from_geofabrik_diffs.sh
          git checkout -- scripts/map/run_daily_diff_pipeline.py
          git checkout -- scripts/map/upsert_daily_diff_analysis_row.py

      - name: Create Initial Seed Snapshot
        id: seed_bootstrap
        if: steps.seed_check.outputs.has_seed != '1'
        run: |
          mkdir -p mapdata/raw mapdata/reports mapdata/build/germany/updates

          curl -L --fail --silent --show-error \
            "https://download.geofabrik.de/europe/germany-latest.osm.pbf" \
            -o mapdata/raw/DEU-latest.osm.pbf

          bash scripts/map/update_from_geofabrik_diffs.sh \
            --region DEU \
            --input-pbf mapdata/raw/DEU-latest.osm.pbf \
            --updates-url https://download.geofabrik.de/europe/germany-updates/ \
            --state-file mapdata/raw/DEU.diff_state.json \
            --report-path mapdata/reports/diff_update.DEU.latest.json \
            --work-dir mapdata/build/germany/updates \
            --dry-run \
            --no-emit-delta

          echo "seeded=1" >> "${GITHUB_OUTPUT}"

      - name: Install Dependencies
        if: steps.seed_check.outputs.has_seed == '1'
        run: |
          python -m pip install --upgrade pip
          python -m pip install osmium

      - name: Run Daily Diff Pipeline
        id: pipeline
        if: steps.seed_check.outputs.has_seed == '1'
        run: |
          python3 scripts/map/run_daily_diff_pipeline.py \
            --region DEU \
            --updates-url https://download.geofabrik.de/europe/germany-updates/ \
            --latest-pbf-url https://download.geofabrik.de/europe/germany-latest.osm.pbf \
            --input-pbf mapdata/raw/DEU-latest.osm.pbf \
            --state-file mapdata/raw/DEU.diff_state.json \
            --report-path mapdata/reports/diff_update.DEU.latest.json \
            --work-dir mapdata/build/germany/updates \
            --daily-dir mapdata/reports/deltas/daily \
            --csv-out mapdata/reports/deltas/daily-diff-analysis.csv \
            --summary-json-out mapdata/reports/deltas/daily-diff-analysis.summary.json \
            --v3-db mapdata/dist-v3/germany/speeds_v3.sqlite \
            --v4-db mapdata/dist-v4/germany/speeds_v4.sqlite

      - name: Check Whether Snapshot Release Needs Seeding
        id: release_check
        if: steps.seed_check.outputs.has_seed == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pbf_tag="${{ steps.tags.outputs.pbf_release_tag }}"
          need_publish=0

          if ! gh release view "${pbf_tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            need_publish=1
          else
            assets_json="$(gh release view "${pbf_tag}" --repo "${GITHUB_REPOSITORY}" --json assets)"
            missing_required="$(python3 -c 'import json,sys; payload=json.loads(sys.argv[1]); assets=payload.get(\"assets\", []); names={str(a.get(\"name\", \"\")) for a in assets if isinstance(a, dict)}; has_pbf=(\"DEU-latest.osm.pbf\" in names) or any(n.startswith(\"DEU-latest.osm.pbf.part\") for n in names); required_other={\"DEU.diff_state.json\", \"diff_update.DEU.latest.json\"}; print(\"1\" if ((not has_pbf) or bool(required_other - names)) else \"0\")' "${assets_json}")"
            if [[ "${missing_required}" == "1" ]]; then
              need_publish=1
            fi
          fi

          echo "need_publish_snapshot=${need_publish}" >> "${GITHUB_OUTPUT}"
          echo "need_publish_snapshot=${need_publish}"

      - name: Publish Updated PBF Snapshot To Release
        if: steps.seed_bootstrap.outputs.seeded == '1' || (steps.seed_check.outputs.has_seed == '1' && (steps.pipeline.outputs.changed == '1' || steps.release_check.outputs.need_publish_snapshot == '1'))
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          pbf_tag="${{ steps.tags.outputs.pbf_release_tag }}"

          if ! gh release view "${pbf_tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release create "${pbf_tag}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "DEU latest PBF snapshot" \
              --notes "Rolling DEU PBF/state snapshot for downstream bundle builds."
          fi

          test -f mapdata/raw/DEU-latest.osm.pbf
          test -f mapdata/raw/DEU.diff_state.json
          test -f mapdata/reports/diff_update.DEU.latest.json

          pbf_size_bytes="$(wc -c < mapdata/raw/DEU-latest.osm.pbf | tr -d ' ')"
          pbf_limit_bytes=2147483648
          if [[ "${pbf_size_bytes}" -ge "${pbf_limit_bytes}" ]]; then
            rm -f mapdata/raw/DEU-latest.osm.pbf.part*
            split -b 1900m -d -a 3 mapdata/raw/DEU-latest.osm.pbf mapdata/raw/DEU-latest.osm.pbf.part
            parts=(mapdata/raw/DEU-latest.osm.pbf.part*)
            if (( ${#parts[@]} == 0 )); then
              echo "Failed to split large PBF into parts." >&2
              exit 1
            fi
            python3 -c 'import json; from pathlib import Path; parts=sorted(Path("mapdata/raw").glob("DEU-latest.osm.pbf.part*")); payload={"asset_name":"DEU-latest.osm.pbf","size_bytes":Path("mapdata/raw/DEU-latest.osm.pbf").stat().st_size,"parts":[p.name for p in parts]}; Path("mapdata/raw/DEU-latest.osm.pbf.parts.json").write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8")'
            for part in "${parts[@]}"; do
              gh release upload "${pbf_tag}" "${part}" --clobber --repo "${GITHUB_REPOSITORY}"
            done
            gh release upload "${pbf_tag}" mapdata/raw/DEU-latest.osm.pbf.parts.json --clobber --repo "${GITHUB_REPOSITORY}"
          else
            gh release upload "${pbf_tag}" mapdata/raw/DEU-latest.osm.pbf --clobber --repo "${GITHUB_REPOSITORY}"
          fi

          gh release upload "${pbf_tag}" mapdata/raw/DEU.diff_state.json --clobber --repo "${GITHUB_REPOSITORY}"
          gh release upload "${pbf_tag}" mapdata/reports/diff_update.DEU.latest.json --clobber --repo "${GITHUB_REPOSITORY}"

          if [[ -n "${{ steps.pipeline.outputs.daily_delta }}" && -f "${{ steps.pipeline.outputs.daily_delta }}" ]]; then
            daily_delta_path="${{ steps.pipeline.outputs.daily_delta }}"
            daily_delta_name="$(basename "${daily_delta_path}")"
            if [[ ! "${daily_delta_name}" =~ ^DEU-[0-9]{4}-[0-9]{2}-[0-9]{2}\.osc\.gz$ ]]; then
              processed_date="${{ steps.pipeline.outputs.processed_date }}"
              daily_delta_name="DEU-${processed_date}.osc.gz"
            fi
            gh release upload "${pbf_tag}" "${daily_delta_path}#${daily_delta_name}" --clobber --repo "${GITHUB_REPOSITORY}"
          fi

      - name: Save Cached Germany PBF
        if: (steps.seed_bootstrap.outputs.seeded == '1' || (steps.seed_check.outputs.has_seed == '1' && (steps.pipeline.outputs.changed == '1' || steps.release_check.outputs.need_publish_snapshot == '1'))) && hashFiles('mapdata/raw/DEU-latest.osm.pbf') != ''
        uses: actions/cache/save@v4
        with:
          path: |
            mapdata/raw/DEU-latest.osm.pbf
            mapdata/raw/DEU.diff_state.json
          key: deu-pbf-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}

      - name: Commit CSV and State
        if: steps.seed_check.outputs.has_seed == '1' && steps.pipeline.outputs.changed == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add mapdata/reports/deltas/daily-diff-analysis.csv
          git add mapdata/raw/DEU.diff_state.json

          if git diff --cached --quiet; then
            echo "No tracked changes to commit."
            exit 0
          fi

          git commit -m "chore(map): update daily diff analysis for ${{ steps.pipeline.outputs.processed_date }}"
          git push
