name: Build Signed Sideload APKs

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Git ref to build"
        required: true
        default: "main"
        type: string
      version_name:
        description: "Android versionName"
        required: true
        default: "1.1"
        type: string
      build_number:
        description: "Base Android build number/versionCode"
        required: true
        default: "10009"
        type: string

permissions:
  contents: write

concurrency:
  group: build-signed-sideload-apks
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.YOUSPEED_ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077

          if [[ -z "${KEYSTORE_BASE64}" ]]; then
            echo "Missing GitHub secret: YOUSPEED_ANDROID_RELEASE_KEYSTORE_BASE64" >&2
            exit 1
          fi

          keystore_path="${RUNNER_TEMP}/youspeed-release.keystore"
          printf '%s' "${KEYSTORE_BASE64}" | base64 --decode > "${keystore_path}"
          if [[ ! -s "${keystore_path}" ]]; then
            echo "The decoded signing keystore is empty." >&2
            exit 1
          fi
          echo "keystore_path=${keystore_path}" >> "${GITHUB_OUTPUT}"
        id: keystore

      - name: Build signed APKs
        working-directory: android
        env:
          YOUSPEED_ANDROID_RELEASE_STORE_FILE: ${{ steps.keystore.outputs.keystore_path }}
          YOUSPEED_ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.YOUSPEED_ANDROID_RELEASE_STORE_PASSWORD }}
          YOUSPEED_ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.YOUSPEED_ANDROID_RELEASE_KEY_ALIAS }}
          YOUSPEED_ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.YOUSPEED_ANDROID_RELEASE_KEY_PASSWORD }}
          YOUSPEED_ANDROID_VERSION_NAME: ${{ inputs.version_name }}
          YOUSPEED_ANDROID_BUILD_NUMBER: ${{ inputs.build_number }}
        run: ./scripts/build-signed-abi-apks.sh

      - name: Upload signed APKs
        uses: actions/upload-artifact@v4
        with:
          name: youspeed-signed-sideload-apks
          path: android/dist/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: android-v${{ inputs.version_name }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(android/dist/*.apk)
          if (( ${#assets[@]} == 0 )); then
            echo "No APK assets were produced." >&2
            exit 1
          fi

          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" "${assets[@]}" \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber
          else
            gh release create "${RELEASE_TAG}" "${assets[@]}" \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${{ inputs.source_ref }}" \
              --title "YouSpeed Android ${{ inputs.version_name }}" \
              --notes "Signed Android APK release for version ${{ inputs.version_name }} (base build number ${{ inputs.build_number }}), split by ABI."
          fi
