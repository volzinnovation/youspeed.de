name: Publish Web Site

on:
  push:
    branches:
      - main
    paths:
      - "Web/**"
      - "sites/**"
      - "scripts/web/**"
      - ".github/workflows/web_pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install web asset dependencies
        run: python3 -m pip install --user pillow

      - name: Publish Web to sites
        run: ./scripts/web/publish_web_to_sites.sh

      - name: Validate published site
        run: node ./scripts/web/check_static_site.mjs sites

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./sites

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
