name: Build Signed Play Bundle

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-signed-play-bundle
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Prepare and verify existing Play upload key
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.YOUSPEED_ANDROID_RELEASE_KEYSTORE_BASE64 }}
          YOUSPEED_ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.YOUSPEED_ANDROID_RELEASE_STORE_PASSWORD }}
          YOUSPEED_ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.YOUSPEED_ANDROID_RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$KEYSTORE_BASE64"
          keystore_path="$RUNNER_TEMP/youspeed-play-upload.keystore"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          keytool -exportcert -keystore "$keystore_path" \
            -storepass:env YOUSPEED_ANDROID_RELEASE_STORE_PASSWORD \
            -alias "$YOUSPEED_ANDROID_RELEASE_KEY_ALIAS" \
            -file "$RUNNER_TEMP/upload-cert.der"
          fingerprint="$(sha256sum "$RUNNER_TEMP/upload-cert.der" | cut -d ' ' -f 1)"
          test "$fingerprint" = '79b38431153de1b1776ea83e1970662d0a40c6a41aecbca958d73e3fe509e08a'
          echo "Verified Google Play upload certificate: $fingerprint"
          echo "path=$keystore_path" >> "$GITHUB_OUTPUT"
      - name: Build and validate signed release
        working-directory: android
        env:
          YOUSPEED_ANDROID_RELEASE_STORE_FILE: ${{ steps.keystore.outputs.path }}
          YOUSPEED_ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.YOUSPEED_ANDROID_RELEASE_STORE_PASSWORD }}
          YOUSPEED_ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.YOUSPEED_ANDROID_RELEASE_KEY_ALIAS }}
          YOUSPEED_ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.YOUSPEED_ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew :app:testReleaseUnitTest :app:lintRelease :app:bundleRelease :app:assembleRelease
          mkdir -p app/build/play-signed
          cp app/build/outputs/bundle/release/app-release.aab app/build/play-signed/YouSpeed-1.3-10032-Play.aab
          cp app/build/outputs/apk/release/app-release.apk app/build/play-signed/YouSpeed-1.3-10032-release.apk
          jarsigner -verify app/build/play-signed/YouSpeed-1.3-10032-Play.aab > app/build/play-signed/signature-verification.txt
          grep -q 'jar verified' app/build/play-signed/signature-verification.txt
          python3 scripts/audit-release-artifact.py app/build/play-signed/YouSpeed-1.3-10032-Play.aab --output app/build/play-signed/artifact-audit.json
          sha256sum app/build/play-signed/*.aab app/build/play-signed/*.apk > app/build/play-signed/SHA256SUMS
      - name: Keep signed artifacts for store upload and device validation
        uses: actions/upload-artifact@v4
        with:
          name: youspeed-play-1.3-10032
          path: android/app/build/play-signed/
          if-no-files-found: error
          retention-days: 14
      - name: Remove temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/youspeed-play-upload.keystore" "$RUNNER_TEMP/upload-cert.der"
