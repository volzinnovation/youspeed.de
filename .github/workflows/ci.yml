name: Test

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # A handful of tests assert on locale-formatted strings (e.g. "Monat Fahrverbot") without
      # pinning the JVM locale themselves, so they pass or fail depending on the host's default
      # locale rather than the code under test. Forcing it here at the JVM level (not via
      # LANG/locale-gen, which isn't guaranteed present on a fresh runner) makes the result
      # deterministic without touching application or test code.
      - name: Run Android unit tests
        working-directory: android
        env:
          TSR_APPLICABILITY_PARITY_OUTPUT: ${{ github.workspace }}/applicability-kotlin.json
        run: ./gradlew :app:testDebugUnitTest -Duser.language=de -Duser.country=DE

      - uses: actions/upload-artifact@v4
        with:
          name: applicability-kotlin
          path: applicability-kotlin.json

  ios-tests:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build consumer app
        run: ./scripts/iphone/build_consumer_app.sh --skip-project-gen

      - name: Run iOS simulator tests
        run: |
          xcodebuild test \
            -project iphone/SpeedDBBench.xcodeproj \
            -scheme SpeedConsumer \
            -destination 'platform=iOS Simulator,name=iPhone 16'

      - name: Export Swift applicability replay
        run: |
          swiftc iphone/SpeedConsumerApp/TrafficSignApplicability.swift scripts/tsr/applicability/Replay.swift -o /tmp/applicability-replay
          /tmp/applicability-replay shared/tsr/applicability/golden-vectors-v1.json > applicability-swift.json

      - uses: actions/upload-artifact@v4
        with:
          name: applicability-swift
          path: applicability-swift.json

  applicability-contracts:
    needs: [android-tests, ios-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install pytest jsonschema
      - uses: actions/download-artifact@v4
        with:
          pattern: applicability-*
          merge-multiple: true
          path: parity
      - name: Validate contracts and Inspector
        run: |
          python -m pytest tests/tsr/test_applicability.py tests/tsr/test_contract_schemas.py tests/tsr/test_v2_contracts.py tests/tsr/test_passage_contracts.py -q
          node --test tests/inspector/tsr_qa_core.test.js
      - name: Compare native associations, state, decisions and reasons
        run: python scripts/tsr/applicability/compare_outputs.py parity/applicability-swift.json parity/applicability-kotlin.json
