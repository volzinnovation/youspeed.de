name: Country PBF Diff Update And Release

on:
  workflow_dispatch:
    inputs:
      bundle_country:
        description: "Geofabrik country id from BundleTargets.top10.json (for example: netherlands)"
        required: false
        default: "netherlands"
        type: string
      pbf_release_tag:
        description: "Optional PBF snapshot release tag override. Empty = <ISO3>-pbf-latest."
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: country-pbf-diff-update-${{ inputs.bundle_country || 'country' }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: false

      - name: Free Runner Disk Space
        run: |
          echo "Disk before cleanup:"
          df -h
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/.ghcup || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          docker image prune -af >/dev/null 2>&1 || true
          echo "Disk after cleanup:"
          df -h

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install osmium

      - name: Ensure Geofabrik Index
        run: |
          mkdir -p mapdata/build/geofabrik
          if [[ ! -f mapdata/build/geofabrik/index-v1.json ]]; then
            curl -L --fail --silent --show-error \
              https://download.geofabrik.de/index-v1.json \
              -o mapdata/build/geofabrik/index-v1.json
          fi

      - name: Resolve Country Release Plan
        id: plan
        run: |
          set -euo pipefail

          plan_json="$(
            python3 scripts/map/resolve_country_release_plan.py \
              --repo-root "$GITHUB_WORKSPACE" \
              --bundle-country "${{ inputs.bundle_country || 'netherlands' }}"
          )"

          python3 - "$plan_json" "$GITHUB_OUTPUT" <<'PY'
          import json
          import sys
          from pathlib import Path

          plan = json.loads(sys.argv[1])
          out = Path(sys.argv[2])
          with out.open("a", encoding="utf-8") as f:
              for key, value in sorted(plan.items()):
                  f.write(f"{key}={value}\n")
          print(json.dumps(plan, indent=2, sort_keys=True))
          PY

      - name: Resolve Effective PBF Release Tag
        id: params
        run: |
          pbf_release_tag="${{ inputs.pbf_release_tag || '' }}"
          if [[ -z "${pbf_release_tag}" ]]; then
            pbf_release_tag="${{ steps.plan.outputs.pbf_release_tag_default }}"
          fi

          echo "pbf_release_tag=${pbf_release_tag}" >> "${GITHUB_OUTPUT}"
          echo "Using pbf release tag: ${pbf_release_tag}"

      - name: Restore Cached Country PBF
        id: pbf-cache-restore
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ steps.plan.outputs.input_pbf_path }}
            ${{ steps.plan.outputs.state_file_path }}
          key: country-pbf-${{ steps.plan.outputs.region_slug }}-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            country-pbf-${{ steps.plan.outputs.region_slug }}-${{ runner.os }}-${{ github.ref_name }}-
            country-pbf-${{ steps.plan.outputs.region_slug }}-${{ runner.os }}-

      - name: Bootstrap Snapshot From GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          mkdir -p mapdata/raw mapdata/reports "${{ steps.plan.outputs.daily_dir }}"
          pbf_tag="${{ steps.params.outputs.pbf_release_tag }}"

          if gh release view "${pbf_tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release download "${pbf_tag}" \
              --repo "${GITHUB_REPOSITORY}" \
              --pattern "${{ steps.plan.outputs.pbf_asset_name }}" \
              --pattern "${{ steps.plan.outputs.pbf_asset_name }}.part*" \
              --pattern "${{ steps.plan.outputs.pbf_parts_meta_asset_name }}" \
              --pattern "${{ steps.plan.outputs.state_asset_name }}" \
              --pattern "${{ steps.plan.outputs.report_asset_name }}" \
              --dir mapdata/raw \
              --clobber || true

            if [[ ! -f "${{ steps.plan.outputs.input_pbf_path }}" ]]; then
              if [[ -f "mapdata/raw/${{ steps.plan.outputs.pbf_parts_meta_asset_name }}" ]]; then
                mapfile -t manifest_parts < <(
                  python3 -c 'import json,sys; payload=json.load(open(sys.argv[1], encoding="utf-8")); [print(str(p)) for p in (payload.get("parts") or [])]' \
                    "mapdata/raw/${{ steps.plan.outputs.pbf_parts_meta_asset_name }}"
                )
                if (( ${#manifest_parts[@]} == 0 )); then
                  echo "PBF parts manifest is missing the part list." >&2
                  exit 1
                fi
                : > "${{ steps.plan.outputs.input_pbf_path }}"
                for part_name in "${manifest_parts[@]}"; do
                  cat "mapdata/raw/${part_name}" >> "${{ steps.plan.outputs.input_pbf_path }}"
                done
              else
                parts=(mapdata/raw/${{ steps.plan.outputs.pbf_asset_name }}.part*)
                if (( ${#parts[@]} > 0 )); then
                  cat "${parts[@]}" > "${{ steps.plan.outputs.input_pbf_path }}"
                fi
              fi
            fi

            if [[ -f "mapdata/raw/${{ steps.plan.outputs.report_asset_name }}" ]]; then
              mv "mapdata/raw/${{ steps.plan.outputs.report_asset_name }}" "${{ steps.plan.outputs.report_path }}"
            fi
          fi

      - name: Check Seed Availability
        id: seed_check
        run: |
          if [[ -f "${{ steps.plan.outputs.input_pbf_path }}" ]]; then
            echo "has_seed=1" >> "${GITHUB_OUTPUT}"
            echo "Seed PBF found. Daily diff pipeline is enabled."
          else
            echo "has_seed=0" >> "${GITHUB_OUTPUT}"
            echo "Seed PBF missing. Will create fresh seed snapshot first."
          fi

      - name: Create Initial Seed Snapshot
        id: seed_bootstrap
        if: steps.seed_check.outputs.has_seed != '1'
        run: |
          set -euo pipefail
          mkdir -p mapdata/raw mapdata/reports "${{ steps.plan.outputs.work_dir }}"

          curl -L --fail --silent --show-error \
            "${{ steps.plan.outputs.pbf_url }}" \
            -o "${{ steps.plan.outputs.input_pbf_path }}"

          bash scripts/map/update_from_geofabrik_diffs.sh \
            --region "${{ steps.plan.outputs.daily_delta_prefix }}" \
            --input-pbf "${{ steps.plan.outputs.input_pbf_path }}" \
            --updates-url "${{ steps.plan.outputs.updates_url }}" \
            --state-file "${{ steps.plan.outputs.state_file_path }}" \
            --report-path "${{ steps.plan.outputs.report_path }}" \
            --work-dir "${{ steps.plan.outputs.work_dir }}" \
            --dry-run \
            --no-emit-delta

          echo "seeded=1" >> "${GITHUB_OUTPUT}"

      - name: Run Daily Diff Pipeline
        id: pipeline
        if: steps.seed_check.outputs.has_seed == '1'
        run: |
          python3 scripts/map/run_daily_diff_pipeline.py \
            --region "${{ steps.plan.outputs.daily_delta_prefix }}" \
            --updates-url "${{ steps.plan.outputs.updates_url }}" \
            --latest-pbf-url "${{ steps.plan.outputs.pbf_url }}" \
            --input-pbf "${{ steps.plan.outputs.input_pbf_path }}" \
            --state-file "${{ steps.plan.outputs.state_file_path }}" \
            --report-path "${{ steps.plan.outputs.report_path }}" \
            --work-dir "${{ steps.plan.outputs.work_dir }}" \
            --daily-dir "${{ steps.plan.outputs.daily_dir }}" \
            --csv-out "${{ steps.plan.outputs.csv_out }}" \
            --summary-json-out "${{ steps.plan.outputs.summary_json_out }}"

      - name: Check Whether Snapshot Release Needs Seeding
        id: release_check
        if: steps.seed_check.outputs.has_seed == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          pbf_tag="${{ steps.params.outputs.pbf_release_tag }}"
          need_publish=0

          if ! gh release view "${pbf_tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            need_publish=1
          else
            assets_json="$(gh release view "${pbf_tag}" --repo "${GITHUB_REPOSITORY}" --json assets)"
            missing_required="$(
              python3 -c 'import json,sys; payload=json.loads(sys.argv[1]); assets=payload.get("assets", []); names={str(a.get("name", "")) for a in assets if isinstance(a, dict)}; pbf_name=sys.argv[2]; state_name=sys.argv[3]; report_name=sys.argv[4]; has_pbf=(pbf_name in names) or any(n.startswith(pbf_name + ".part") for n in names); required={state_name, report_name}; print("1" if ((not has_pbf) or bool(required - names)) else "0")' \
                "${assets_json}" \
                "${{ steps.plan.outputs.pbf_asset_name }}" \
                "${{ steps.plan.outputs.state_asset_name }}" \
                "${{ steps.plan.outputs.report_asset_name }}"
            )"
            if [[ "${missing_required}" == "1" ]]; then
              need_publish=1
            fi
          fi

          echo "need_publish_snapshot=${need_publish}" >> "${GITHUB_OUTPUT}"
          echo "need_publish_snapshot=${need_publish}"

      - name: Publish Updated Country PBF Snapshot
        if: steps.seed_bootstrap.outputs.seeded == '1' || (steps.seed_check.outputs.has_seed == '1' && (steps.pipeline.outputs.changed == '1' || steps.release_check.outputs.need_publish_snapshot == '1'))
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          pbf_tag="${{ steps.params.outputs.pbf_release_tag }}"

          if ! gh release view "${pbf_tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release create "${pbf_tag}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${{ steps.plan.outputs.pbf_release_title_default }}" \
              --notes "Rolling ${{ steps.plan.outputs.country_code }} PBF/state snapshot for downstream bundle builds."
          fi

          test -f "${{ steps.plan.outputs.input_pbf_path }}"
          test -f "${{ steps.plan.outputs.state_file_path }}"
          test -f "${{ steps.plan.outputs.report_path }}"

          pbf_size_bytes="$(wc -c < "${{ steps.plan.outputs.input_pbf_path }}" | tr -d ' ')"
          pbf_limit_bytes=2147483648
          if [[ "${pbf_size_bytes}" -ge "${pbf_limit_bytes}" ]]; then
            rm -f "mapdata/raw/${{ steps.plan.outputs.pbf_asset_name }}.part"*
            split -b 1900m -d -a 3 \
              "${{ steps.plan.outputs.input_pbf_path }}" \
              "mapdata/raw/${{ steps.plan.outputs.pbf_asset_name }}.part"
            parts=(mapdata/raw/${{ steps.plan.outputs.pbf_asset_name }}.part*)
            if (( ${#parts[@]} == 0 )); then
              echo "Failed to split large PBF into parts." >&2
              exit 1
            fi
            python3 -c 'import json,sys; from pathlib import Path; pbf=Path(sys.argv[1]); parts=sorted(Path("mapdata/raw").glob(sys.argv[2] + ".part*")); payload={"asset_name":sys.argv[2],"size_bytes":pbf.stat().st_size,"parts":[p.name for p in parts]}; Path(sys.argv[3]).write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8")' \
              "${{ steps.plan.outputs.input_pbf_path }}" \
              "${{ steps.plan.outputs.pbf_asset_name }}" \
              "mapdata/raw/${{ steps.plan.outputs.pbf_parts_meta_asset_name }}"
            for part in "${parts[@]}"; do
              gh release upload "${pbf_tag}" "${part}" --clobber --repo "${GITHUB_REPOSITORY}"
            done
            gh release upload "${pbf_tag}" "mapdata/raw/${{ steps.plan.outputs.pbf_parts_meta_asset_name }}" --clobber --repo "${GITHUB_REPOSITORY}"
          else
            gh release upload "${pbf_tag}" "${{ steps.plan.outputs.input_pbf_path }}#${{ steps.plan.outputs.pbf_asset_name }}" --clobber --repo "${GITHUB_REPOSITORY}"
          fi

          gh release upload "${pbf_tag}" "${{ steps.plan.outputs.state_file_path }}#${{ steps.plan.outputs.state_asset_name }}" --clobber --repo "${GITHUB_REPOSITORY}"
          gh release upload "${pbf_tag}" "${{ steps.plan.outputs.report_path }}#${{ steps.plan.outputs.report_asset_name }}" --clobber --repo "${GITHUB_REPOSITORY}"
          gh release upload "${pbf_tag}" "${{ steps.plan.outputs.csv_out }}#${{ steps.plan.outputs.region_slug }}.daily-diff-analysis.csv" --clobber --repo "${GITHUB_REPOSITORY}" || true
          gh release upload "${pbf_tag}" "${{ steps.plan.outputs.summary_json_out }}#${{ steps.plan.outputs.region_slug }}.daily-diff-analysis.summary.json" --clobber --repo "${GITHUB_REPOSITORY}" || true

          if [[ -n "${{ steps.pipeline.outputs.daily_delta }}" && -f "${{ steps.pipeline.outputs.daily_delta }}" ]]; then
            daily_delta_path="${{ steps.pipeline.outputs.daily_delta }}"
            daily_delta_name="$(basename "${daily_delta_path}")"
            if [[ ! "${daily_delta_name}" =~ ^${{ steps.plan.outputs.daily_delta_prefix }}-[0-9]{4}-[0-9]{2}-[0-9]{2}\.osc\.gz$ ]]; then
              processed_date="${{ steps.pipeline.outputs.processed_date }}"
              daily_delta_name="${{ steps.plan.outputs.daily_delta_prefix }}-${processed_date}.osc.gz"
            fi
            gh release upload "${pbf_tag}" "${daily_delta_path}#${daily_delta_name}" --clobber --repo "${GITHUB_REPOSITORY}"
          fi

      - name: Save Cached Country PBF
        if: steps.seed_bootstrap.outputs.seeded == '1' || (steps.seed_check.outputs.has_seed == '1' && (steps.pipeline.outputs.changed == '1' || steps.release_check.outputs.need_publish_snapshot == '1'))
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ steps.plan.outputs.input_pbf_path }}
            ${{ steps.plan.outputs.state_file_path }}
          key: country-pbf-${{ steps.plan.outputs.region_slug }}-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
