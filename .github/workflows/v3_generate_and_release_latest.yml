name: Germany V3 Bundle Build And Release

on:
  workflow_run:
    workflows:
      - Germany PBF Diff Update And Release
    types:
      - completed
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag used for app-consumed latest v3 bundle assets"
        required: false
        default: "deu-v3-data-latest"
        type: string
      pbf_release_tag:
        description: "Release tag containing updated Germany PBF snapshot assets"
        required: false
        default: "deu-pbf-latest"
        type: string
      retention_updates:
        description: "How many incremental updates to keep in delta index"
        required: false
        default: "30"
        type: string
      max_geom_points:
        description: "Max sampled geometry points for v1 preprocessing"
        required: false
        default: "8"
        type: string
      force_publish:
        description: "Force full bundle rebuild/publish even when upstream diff changed!=1"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: germany-v3-bundle-release-latest
  cancel-in-progress: false

jobs:
  build-release:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.head_branch == github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    timeout-minutes: 480
    env:
      REGION: germany
      ISO3: DEU
      DEFAULT_RELEASE_TAG: deu-v3-data-latest
      DEFAULT_PBF_RELEASE_TAG: deu-pbf-latest
      RETENTION_UPDATES: ${{ inputs.retention_updates || '30' }}
      MAX_GEOM_POINTS: ${{ inputs.max_geom_points || '8' }}
      FORCE_PUBLISH: ${{ inputs.force_publish && '1' || '0' }}
      INPUT_PBF: mapdata/raw/DEU-latest.osm.pbf
      INPUT_STATE: mapdata/raw/DEU.diff_state.json
      INPUT_REPORT: mapdata/reports/diff_update.DEU.latest.json
      INPUT_DELTA: mapdata/reports/deltas/daily/DEU-update.osc.gz
      BUNDLE_DIR: mapdata/bundles/v3/germany/latest
      BUNDLE_DB_ASSET: DEU-latest.speeds_v3.sqlite
      BUNDLE_MANIFEST_ASSET: DEU-latest.bundle-manifest.v3.json
      DELTA_INDEX_ASSET: DEU-latest.delta-index.v3.json
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free Runner Disk Space
        run: |
          echo "Disk before cleanup:"
          df -h
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/.ghcup || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          docker image prune -af >/dev/null 2>&1 || true
          echo "Disk after cleanup:"
          df -h

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install osmium
          chmod +x scripts/map/publish_v3_release_assets.sh
          chmod +x scripts/map/build_v3_delta_index.py
          chmod +x scripts/map/build_v3_delta_pack.py
          chmod +x scripts/map/publish_v3_bundle.py
          chmod +x scripts/map/roll_v3_delta_index.py
          chmod +x scripts/map/prune_v3_release_assets.py

      - name: Resolve Release Tags
        id: tags
        run: |

          release_tag="${{ github.event.inputs.release_tag || '' }}"
          if [[ -z "${release_tag}" ]]; then
            release_tag="${DEFAULT_RELEASE_TAG}"
          fi

          pbf_release_tag="${{ github.event.inputs.pbf_release_tag || '' }}"
          if [[ -z "${pbf_release_tag}" ]]; then
            pbf_release_tag="${DEFAULT_PBF_RELEASE_TAG}"
          fi

          {
            echo "release_tag=${release_tag}"
            echo "pbf_release_tag=${pbf_release_tag}"
          } >> "${GITHUB_OUTPUT}"

          echo "Using v3 release tag: ${release_tag}"
          echo "Using PBF release tag: ${pbf_release_tag}"

      - name: Download Updated Germany PBF Snapshot From Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          mkdir -p mapdata/raw mapdata/reports mapdata/reports/deltas/daily

          pbf_tag="${{ steps.tags.outputs.pbf_release_tag }}"
          if ! gh release view "${pbf_tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Required PBF release not found: ${pbf_tag}" >&2
            echo "Run Germany PBF Diff Update And Release first." >&2
            exit 1
          fi

          resolve_iso_pbf() {
            rm -f "${INPUT_PBF}" mapdata/raw/DEU-latest.osm.pbf.part* mapdata/raw/DEU-latest.osm.pbf.parts.json

            gh release download "${pbf_tag}" \
              --repo "${GITHUB_REPOSITORY}" \
              --pattern "DEU-latest.osm.pbf" \
              --pattern "DEU-latest.osm.pbf.part*" \
              --pattern "DEU-latest.osm.pbf.parts.json" \
              --pattern "DEU.diff_state.json" \
              --pattern "diff_update.DEU.latest.json" \
              --dir mapdata/raw \
              --clobber || true

            if [[ -f "${INPUT_PBF}" ]]; then
              return 0
            fi

            if [[ -f mapdata/raw/DEU-latest.osm.pbf.parts.json ]]; then
              mapfile -t manifest_parts < <(python3 -c 'import json,sys; obj=json.load(open(sys.argv[1], encoding="utf-8")); parts=obj.get("parts") or []; [print(str(p)) for p in parts]' mapdata/raw/DEU-latest.osm.pbf.parts.json)
              if (( ${#manifest_parts[@]} == 0 )); then
                echo "parts manifest is missing part list" >&2
                return 1
              fi
              : > "${INPUT_PBF}"
              for part_name in "${manifest_parts[@]}"; do
                part_path="mapdata/raw/${part_name}"
                if [[ ! -f "${part_path}" ]]; then
                  echo "missing pbf part: ${part_path}" >&2
                  return 1
                fi
                cat "${part_path}" >> "${INPUT_PBF}"
              done
              return 0
            fi

            parts=(mapdata/raw/DEU-latest.osm.pbf.part*)
            if (( ${#parts[@]} > 0 )); then
              cat "${parts[@]}" > "${INPUT_PBF}"
              return 0
            fi

            return 1
          }

          for attempt in 1 2 3 4 5 6; do
            if resolve_iso_pbf; then
              break
            fi
            echo "DEU PBF assets not ready on release ${pbf_tag} (attempt ${attempt}/6)." >&2
            sleep 20
          done

          [[ -f mapdata/raw/diff_update.DEU.latest.json ]] && mv mapdata/raw/diff_update.DEU.latest.json "${INPUT_REPORT}" || true

          rm -f "${INPUT_DELTA}"
          delta_date=""
          if [[ -f "${INPUT_REPORT}" ]]; then
            delta_date="$(python3 -c 'import json,sys; from pathlib import Path; p=Path(sys.argv[1]); payload=json.loads(p.read_text(encoding="utf-8")); pbf_after=payload.get("pbf_after", {}) if isinstance(payload, dict) else {}; server_after=payload.get("server_state_after", {}) if isinstance(payload, dict) else {}; ts=(pbf_after.get("timestamp") if isinstance(pbf_after, dict) else "") or (server_after.get("timestamp") if isinstance(server_after, dict) else ""); print(str(ts)[:10] if ts else "")' "${INPUT_REPORT}" 2>/dev/null || true)"
          fi

          downloaded_delta=0
          if [[ -n "${delta_date}" ]]; then
            dated_delta_asset="DEU-${delta_date}.osc.gz"
            if gh release download "${pbf_tag}" \
              --repo "${GITHUB_REPOSITORY}" \
              --pattern "${dated_delta_asset}" \
              --dir mapdata/reports/deltas/daily \
              --clobber; then
              mv "mapdata/reports/deltas/daily/${dated_delta_asset}" "${INPUT_DELTA}"
              echo "Downloaded dated daily delta file: ${dated_delta_asset}."
              downloaded_delta=1
            fi
          fi

          if [[ "${downloaded_delta}" != "1" ]]; then
            echo "No dated daily delta asset found in release (delta build will be skipped)."
          fi

          if [[ ! -f "${INPUT_PBF}" ]]; then
            echo "Unable to resolve ${INPUT_PBF} from release ${pbf_tag}." >&2
            echo "Expected DEU-latest.osm.pbf OR DEU-latest.osm.pbf.part* assets." >&2
            gh release view "${pbf_tag}" --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets[].name' >&2 || true
            exit 1
          fi

          if [[ ! -f "${INPUT_STATE}" ]]; then
            echo '{"updates_url":"https://download.geofabrik.de/europe/germany-updates/","last_applied_seq":null,"last_applied_timestamp":null}' > "${INPUT_STATE}"
          fi

          if [[ ! -f "${INPUT_REPORT}" ]]; then
            ts="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            python3 -c 'import json,sys; out=sys.argv[1]; ts=sys.argv[2]; payload={"region":"DEU","status":"bootstrap","updated_at_utc":ts,"pbf_after":{"timestamp":ts},"server_state_after":{"timestamp":ts},"delta_export":{"status":"skipped","path":None}}; open(out,"w",encoding="utf-8").write(json.dumps(payload,indent=2,sort_keys=True)+"\n")' "${INPUT_REPORT}" "${ts}"
          fi

          test -f "${INPUT_PBF}"
          test -f "${INPUT_REPORT}"

      - name: Resolve Bundle Version And Delta Path
        id: version
        run: |
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          import os
          from pathlib import Path

          report_path = Path(os.environ["INPUT_REPORT"])
          payload = json.loads(report_path.read_text(encoding="utf-8"))

          pbf_after = payload.get("pbf_after", {}) if isinstance(payload, dict) else {}
          server_after = payload.get("server_state_after", {}) if isinstance(payload, dict) else {}
          ts = pbf_after.get("timestamp") or server_after.get("timestamp")
          if not ts:
              ts = datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          bundle_version = str(ts)[:10]

          delta_path = ""
          delta_export = payload.get("delta_export", {}) if isinstance(payload, dict) else {}
          delta_status = str(delta_export.get("status") or "")
          diff_changed = "1" if delta_status == "exported" else "0"
          release_delta = Path(os.environ["INPUT_DELTA"])
          if release_delta.exists() and delta_status == "exported":
              delta_path = str(release_delta)

          out = Path(__import__("os").environ["GITHUB_OUTPUT"])
          with out.open("a", encoding="utf-8") as f:
              f.write(f"bundle_version={bundle_version}\n")
              f.write(f"delta_path={delta_path}\n")
              f.write(f"diff_changed={diff_changed}\n")
          print(f"bundle_version={bundle_version}")
          print(f"delta_path={delta_path}")
          print(f"diff_changed={diff_changed}")
          PY

      - name: Fetch Previous Latest Bundle Metadata
        run: |
          release_base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${{ steps.tags.outputs.release_tag }}"
          prev_manifest_tmp="/tmp/prev_bundle_manifest.v3.json"
          prev_index_tmp="/tmp/prev_delta_index.v3.json"

          rm -f "${prev_manifest_tmp}" "${prev_index_tmp}"
          prev_manifest_url="${release_base}/${BUNDLE_MANIFEST_ASSET}"
          if curl -L --fail --silent --show-error "${prev_manifest_url}" -o "${prev_manifest_tmp}"; then
            echo "Found previous bundle manifest: ${BUNDLE_MANIFEST_ASSET}"
          else
            rm -f "${prev_manifest_tmp}"
          fi

          if [[ -f "${prev_manifest_tmp}" ]]; then
            prev_index_url="$(python3 -c 'import json; from pathlib import Path; obj = json.loads(Path("/tmp/prev_bundle_manifest.v3.json").read_text(encoding="utf-8")); print(((obj.get("delta_index") or {}).get("url")) or "")')"
            if [[ -n "${prev_index_url}" ]]; then
              if ! curl -L --fail --silent --show-error "${prev_index_url}" -o "${prev_index_tmp}"; then
                rm -f "${prev_index_tmp}"
              fi
            fi
          fi

      - name: Check Bundle Version Change
        id: compare
        run: |
          prev_manifest_tmp="/tmp/prev_bundle_manifest.v3.json"
          new_version="${{ steps.version.outputs.bundle_version }}"
          diff_changed="${{ steps.version.outputs.diff_changed }}"
          force_publish="${FORCE_PUBLISH}"

          if [[ "${force_publish}" == "1" ]]; then
            echo "needs_publish=1" >> "${GITHUB_OUTPUT}"
            echo "Force publish requested via workflow input; continuing with build/release."
            exit 0
          fi

          if [[ "${diff_changed}" != "1" ]]; then
            echo "needs_publish=0" >> "${GITHUB_OUTPUT}"
            echo "No daily diff change detected (upstream changed!=1); skipping build/release."
            exit 0
          fi

          if [[ -f "${prev_manifest_tmp}" ]]; then
            prev_version="$(python3 -c 'import json; from pathlib import Path; obj = json.loads(Path("/tmp/prev_bundle_manifest.v3.json").read_text(encoding="utf-8")); print(obj.get("bundle_version") or "")')"
            if [[ -n "${prev_version}" && "${prev_version}" == "${new_version}" ]]; then
              echo "needs_publish=0" >> "${GITHUB_OUTPUT}"
              echo "Bundle already up to date (${new_version}); skipping build/release."
              exit 0
            fi
          fi

          echo "needs_publish=1" >> "${GITHUB_OUTPUT}"

      - name: Build v1 Artifacts Required For v3, Then Build v3 DB
        if: steps.compare.outputs.needs_publish == '1'
        run: |
          scripts/map/build_region_artifacts.sh \
            --region "${REGION}" \
            --input "${INPUT_PBF}" \
            --engine pyosmium \
            --max-geom-points "${MAX_GEOM_POINTS}"

          python3 scripts/map/build_spatialite_v3.py \
            --v1-dist "mapdata/dist/${REGION}" \
            --out-db "mapdata/dist-v3/${REGION}/speeds_v3.sqlite"

      - name: Regression Check (paper benchmark smoke contract)
        if: steps.compare.outputs.needs_publish == '1'
        run: |
          python3 scripts/map/validate_v3_release_regressions.py \
            --db "mapdata/dist-v3/${REGION}/speeds_v3.sqlite" \
            --probe-way-id "17721265" \
            --expected-maxspeed-kmh "30" \
            --probe-ref-way-id "1220097540" \
            --expected-ref "L 564" \
            --out-json "mapdata/reports/${REGION}-v3-release-regression.json"

      - name: Cleanup Heavy Build Intermediates
        if: steps.compare.outputs.needs_publish == '1'
        run: |
          rm -f "${INPUT_PBF}" \
            mapdata/raw/DEU-latest.osm.pbf.part* \
            mapdata/raw/DEU-latest.osm.pbf.parts.json
          rm -rf "mapdata/build/${REGION}" "mapdata/dist/${REGION}"
          rm -rf ~/.cache/pip
          echo "Disk after removing heavy intermediates:"
          df -h

      - name: Build New Incremental Delta (If Possible)
        if: steps.compare.outputs.needs_publish == '1'
        id: delta
        run: |
          mkdir -p "${BUNDLE_DIR}"

          prev_manifest_tmp="/tmp/prev_bundle_manifest.v3.json"
          prev_db_tmp="/tmp/prev_speeds_v3.sqlite"
          new_delta_manifest=""
          new_delta_asset_path=""

          if [[ -f "${prev_manifest_tmp}" && -n "${{ steps.version.outputs.delta_path }}" && -f "${{ steps.version.outputs.delta_path }}" ]]; then
            prev_version="$(python3 -c 'import json; from pathlib import Path; obj = json.loads(Path("/tmp/prev_bundle_manifest.v3.json").read_text(encoding="utf-8")); print(obj.get("bundle_version") or "")')"
            prev_db_url="$(python3 -c 'import json; from pathlib import Path; obj = json.loads(Path("/tmp/prev_bundle_manifest.v3.json").read_text(encoding="utf-8")); print(((obj.get("db") or {}).get("url")) or "")')"
            prev_db_parts_json="$(python3 -c 'import json; from pathlib import Path; obj = json.loads(Path("/tmp/prev_bundle_manifest.v3.json").read_text(encoding="utf-8")); print(json.dumps(obj.get("db_parts") or []))')"
            prev_db_parts_count="$(python3 -c 'import json; import sys; payload=json.loads(sys.argv[1]); print(len(payload) if isinstance(payload, list) else 0)' "${prev_db_parts_json}")"

            if [[ -n "${prev_version}" && "${prev_version}" != "${{ steps.version.outputs.bundle_version }}" ]]; then
              rm -f "${prev_db_tmp}"
              downloaded_prev_db=0
              if [[ "${prev_db_parts_count}" -gt 0 ]]; then
                if python3 scripts/map/download_db_parts.py \
                  --parts-json "${prev_db_parts_json}" \
                  --out "${prev_db_tmp}"; then
                  downloaded_prev_db=1
                else
                  echo "Previous db_parts download failed; skipping delta creation."
                  rm -f "${prev_db_tmp}"
                fi
              elif [[ -n "${prev_db_url}" ]]; then
                if curl -L --fail --silent --show-error "${prev_db_url}" -o "${prev_db_tmp}"; then
                  downloaded_prev_db=1
                else
                  echo "Previous db.url download failed; skipping delta creation."
                  rm -f "${prev_db_tmp}"
                fi
              else
                echo "Previous manifest has neither db_parts nor db.url; skipping delta creation."
              fi

              if [[ ! -s "${prev_db_tmp}" ]]; then
                echo "Previous DB unavailable (no db.url and no usable db_parts); skipping delta creation."
              else
                delta_dir="${BUNDLE_DIR}/deltas/${prev_version}_to_${{ steps.version.outputs.bundle_version }}"
                patch_name="DEU-${{ steps.version.outputs.bundle_version }}.v3_patch_from_${prev_version}.sql"
                manifest_name="DEU-${{ steps.version.outputs.bundle_version }}.v3_delta_manifest_from_${prev_version}.json"

                python3 scripts/map/build_v3_delta_pack.py \
                  --base-db "${prev_db_tmp}" \
                  --diff-file "${{ steps.version.outputs.delta_path }}" \
                  --region "${REGION}" \
                  --from-version "${prev_version}" \
                  --to-version "${{ steps.version.outputs.bundle_version }}" \
                  --out-dir "${delta_dir}" \
                  --patch-file-name "${patch_name}" \
                  --manifest-name "${manifest_name}" \
                  --github-owner "${GITHUB_REPOSITORY%/*}" \
                  --github-repo "${GITHUB_REPOSITORY#*/}" \
                  --github-release-tag "${{ steps.tags.outputs.release_tag }}"

                new_delta_manifest="${delta_dir}/${manifest_name}"
                new_delta_asset_path="${manifest_name}"
              fi
            fi
          fi

          {
            echo "new_delta_manifest=${new_delta_manifest}"
            echo "new_delta_asset_path=${new_delta_asset_path}"
          } >> "${GITHUB_OUTPUT}"

          rm -f "${prev_db_tmp}"

      - name: Roll Delta Index (Retain Latest 30 Incrementals)
        if: steps.compare.outputs.needs_publish == '1'
        run: |
          mkdir -p "${BUNDLE_DIR}"
          release_base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${{ steps.tags.outputs.release_tag }}"
          existing_args=()
          if [[ -f /tmp/prev_delta_index.v3.json ]]; then
            existing_args=(--existing-index /tmp/prev_delta_index.v3.json)
          fi

          new_args=()
          if [[ -n "${{ steps.delta.outputs.new_delta_manifest }}" ]]; then
            new_args=(
              --new-delta-manifest "${{ steps.delta.outputs.new_delta_manifest }}"
              --new-delta-manifest-asset-path "${{ steps.delta.outputs.new_delta_asset_path }}"
              --release-asset-base-url "${release_base}"
            )
          fi

          python3 scripts/map/roll_v3_delta_index.py \
            --output "${BUNDLE_DIR}/${DELTA_INDEX_ASSET}" \
            --retention-count "${RETENTION_UPDATES}" \
            "${existing_args[@]}" \
            "${new_args[@]}"

      - name: Disk Check Before Publish
        if: steps.compare.outputs.needs_publish == '1'
        run: |
          df -h
          du -sh mapdata/dist-v3/"${REGION}" mapdata/bundles/v3/"${REGION}" 2>/dev/null || true

      - name: Publish Latest Full Bundle Manifest
        if: steps.compare.outputs.needs_publish == '1'
        run: |
          python3 scripts/map/publish_v3_bundle.py \
            --region "${REGION}" \
            --country-code "DEU" \
            --db "mapdata/dist-v3/${REGION}/speeds_v3.sqlite" \
            --bundle-version "${{ steps.version.outputs.bundle_version }}" \
            --bundle-dir-name latest \
            --out-root mapdata/bundles/v3 \
            --db-file-name "${BUNDLE_DB_ASSET}" \
            --manifest-name "${BUNDLE_MANIFEST_ASSET}" \
            --penalty-rules "iphone/SpeedConsumerApp/Rules/DEU-rules.json" \
            --delta-index "${BUNDLE_DIR}/${DELTA_INDEX_ASSET}" \
            --delta-index-file-name "${DELTA_INDEX_ASSET}" \
            --github-owner "${GITHUB_REPOSITORY%/*}" \
            --github-repo "${GITHUB_REPOSITORY#*/}" \
            --github-release-tag "${{ steps.tags.outputs.release_tag }}"

      - name: Upload Latest Bundle Assets To Release
        if: steps.compare.outputs.needs_publish == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./scripts/map/publish_v3_release_assets.sh \
            --repo "${GITHUB_REPOSITORY}" \
            --tag "${{ steps.tags.outputs.release_tag }}" \
            --bundle-dir "${BUNDLE_DIR}" \
            --title "YouSpeed DEU v3 latest data bundle"

      - name: Prune Old Incremental Assets Beyond Retention
        if: steps.compare.outputs.needs_publish == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/map/prune_v3_release_assets.py \
            --repo "${GITHUB_REPOSITORY}" \
            --release-tag "${{ steps.tags.outputs.release_tag }}" \
            --delta-index "${BUNDLE_DIR}/${DELTA_INDEX_ASSET}" \
            --bundle-manifest "${BUNDLE_DIR}/${BUNDLE_MANIFEST_ASSET}" \
            --bundle-manifest-name "${BUNDLE_MANIFEST_ASSET}" \
            --delta-index-name "${DELTA_INDEX_ASSET}" \
            --db-file-name "${BUNDLE_DB_ASSET}" \
            --delta-manifest-prefix "DEU-" \
            --patch-prefix "DEU-"
