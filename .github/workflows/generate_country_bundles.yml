name: EU Country Incremental Bundle Build

on:
  workflow_dispatch:
    inputs:
      bundle_country:
        description: "Country, region, or shard id from BundleTargets.top10.json / Geofabrik (for example: netherlands or baden-wuerttemberg)"
        required: false
        default: "netherlands"
        type: string
      regional_shards:
        description: "Legacy flag. Incremental release mode currently supports only single-country bundles."
        required: false
        default: false
        type: boolean
      bundle_version:
        description: "Optional bundle version override (YYYY-MM-DD). Empty uses the PBF report timestamp."
        required: false
        default: ""
        type: string
      max_geom_points:
        description: "Max sampled geometry points for preprocessing"
        required: false
        default: "8"
        type: string
      release_tag:
        description: "Optional bundle release tag override. Empty = resolved country bundle tag."
        required: false
        default: ""
        type: string
      pbf_release_tag:
        description: "Optional PBF snapshot release tag override. Empty = <ISO3>-pbf-latest."
        required: false
        default: ""
        type: string
      retention_updates:
        description: "How many incremental updates to keep in delta index"
        required: false
        default: "30"
        type: string
      skip_release_urls:
        description: "Do not embed GitHub release URLs in generated manifests"
        required: false
        default: false
        type: boolean
      force_publish:
        description: "Force full rebuild/release even when no diff change was detected"
        required: false
        default: false
        type: boolean
      execute:
        description: "Run full build (true) or only print the resolved plan (false)"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: country-incremental-bundle-${{ inputs.bundle_country || 'country' }}
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"

jobs:
  build-country:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free Runner Disk Space
        run: |
          echo "Disk before cleanup:"
          df -h
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/.ghcup || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          docker image prune -af >/dev/null 2>&1 || true
          echo "Disk after cleanup:"
          df -h

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install osmium
          chmod +x scripts/map/build_region_artifacts.sh
          chmod +x scripts/map/publish_v3_release_assets.sh
          chmod +x scripts/map/prune_v3_release_assets.py
          chmod +x scripts/map/roll_v3_delta_index.py

      - name: Ensure Geofabrik Index
        run: |
          mkdir -p mapdata/build/geofabrik
          if [[ ! -f mapdata/build/geofabrik/index-v1.json ]]; then
            curl -L --fail --silent --show-error \
              https://download.geofabrik.de/index-v1.json \
              -o mapdata/build/geofabrik/index-v1.json
          fi

      - name: Guard Unsupported Regional Shards Mode
        if: ${{ inputs.regional_shards }}
        run: |
          echo "regional_shards=true is not supported in the incremental country workflow." >&2
          echo "Use the dedicated Germany/Karlsruhe workflows for shard-based incremental releases." >&2
          exit 1

      - name: Resolve Country Release Plan
        id: plan
        run: |
          set -euo pipefail

          plan_json="$(
            python3 scripts/map/resolve_country_release_plan.py \
              --repo-root "$GITHUB_WORKSPACE" \
              --bundle-country "${{ inputs.bundle_country || 'netherlands' }}"
          )"

          python3 - "$plan_json" "$GITHUB_OUTPUT" <<'PY'
          import json
          import sys
          from pathlib import Path

          plan = json.loads(sys.argv[1])
          out = Path(sys.argv[2])
          with out.open("a", encoding="utf-8") as f:
              for key, value in sorted(plan.items()):
                  f.write(f"{key}={value}\n")
          print(json.dumps(plan, indent=2, sort_keys=True))
          PY

      - name: Resolve Effective Tags And Flags
        id: params
        run: |
          set -euo pipefail

          release_tag="${{ inputs.release_tag || '' }}"
          if [[ -z "${release_tag}" ]]; then
            release_tag="${{ steps.plan.outputs.bundle_release_tag_default }}"
          fi

          pbf_release_tag="${{ inputs.pbf_release_tag || '' }}"
          if [[ -z "${pbf_release_tag}" ]]; then
            pbf_release_tag="${{ steps.plan.outputs.pbf_release_tag_default }}"
          fi

          skip_release_urls="${{ inputs.skip_release_urls }}"
          force_publish="${{ inputs.force_publish }}"
          execute="${{ inputs.execute }}"

          {
            echo "release_tag=${release_tag}"
            echo "pbf_release_tag=${pbf_release_tag}"
            echo "skip_release_urls=${skip_release_urls}"
            echo "force_publish=${force_publish}"
            echo "execute=${execute}"
          } >> "${GITHUB_OUTPUT}"

          echo "Bundle release tag: ${release_tag}"
          echo "PBF release tag: ${pbf_release_tag}"

      - name: Print Dry Run Plan
        if: ${{ inputs.execute != true }}
        run: |
          echo "Incremental bundle release plan resolved successfully."
          echo "Country: ${{ steps.plan.outputs.bundle_country }} (${{ steps.plan.outputs.country_code }})"
          echo "Bundle release: ${{ steps.params.outputs.release_tag }}"
          echo "PBF release: ${{ steps.params.outputs.pbf_release_tag }}"

      - name: Download Maintained Country PBF Snapshot
        if: ${{ inputs.execute }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          mkdir -p mapdata/raw mapdata/reports "${{ steps.plan.outputs.daily_dir }}"
          pbf_tag="${{ steps.params.outputs.pbf_release_tag }}"

          if ! gh release view "${pbf_tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Required PBF release not found: ${pbf_tag}" >&2
            echo "Run Country PBF Diff Update And Release first." >&2
            exit 1
          fi

          gh release download "${pbf_tag}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "${{ steps.plan.outputs.pbf_asset_name }}" \
            --pattern "${{ steps.plan.outputs.pbf_asset_name }}.part*" \
            --pattern "${{ steps.plan.outputs.pbf_parts_meta_asset_name }}" \
            --pattern "${{ steps.plan.outputs.state_asset_name }}" \
            --pattern "${{ steps.plan.outputs.report_asset_name }}" \
            --pattern "${{ steps.plan.outputs.daily_delta_glob }}" \
            --dir mapdata/raw \
            --clobber || true

          if [[ ! -f "${{ steps.plan.outputs.input_pbf_path }}" ]]; then
            if [[ -f "mapdata/raw/${{ steps.plan.outputs.pbf_parts_meta_asset_name }}" ]]; then
              mapfile -t manifest_parts < <(
                python3 -c 'import json,sys; payload=json.load(open(sys.argv[1], encoding="utf-8")); [print(str(p)) for p in (payload.get("parts") or [])]' \
                  "mapdata/raw/${{ steps.plan.outputs.pbf_parts_meta_asset_name }}"
              )
              if (( ${#manifest_parts[@]} == 0 )); then
                echo "PBF parts manifest is missing the part list." >&2
                exit 1
              fi
              : > "${{ steps.plan.outputs.input_pbf_path }}"
              for part_name in "${manifest_parts[@]}"; do
                cat "mapdata/raw/${part_name}" >> "${{ steps.plan.outputs.input_pbf_path }}"
              done
            else
              parts=(mapdata/raw/${{ steps.plan.outputs.pbf_asset_name }}.part*)
              if (( ${#parts[@]} > 0 )); then
                cat "${parts[@]}" > "${{ steps.plan.outputs.input_pbf_path }}"
              fi
            fi
          fi

          if [[ -f "mapdata/raw/${{ steps.plan.outputs.report_asset_name }}" ]]; then
            mv "mapdata/raw/${{ steps.plan.outputs.report_asset_name }}" "${{ steps.plan.outputs.report_path }}"
          fi

          deltas=(mapdata/raw/${{ steps.plan.outputs.daily_delta_prefix }}-*.osc.gz)
          if (( ${#deltas[@]} > 0 )); then
            mv mapdata/raw/${{ steps.plan.outputs.daily_delta_prefix }}-*.osc.gz "${{ steps.plan.outputs.daily_dir }}/"
          fi

          test -s "${{ steps.plan.outputs.input_pbf_path }}"
          test -f "${{ steps.plan.outputs.report_path }}"

      - name: Download Coverage Poly
        if: ${{ inputs.execute && steps.plan.outputs.poly_url != '' }}
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "${{ steps.plan.outputs.input_poly_path }}")"
          curl -L --fail --silent --show-error \
            "${{ steps.plan.outputs.poly_url }}" \
            -o "${{ steps.plan.outputs.input_poly_path }}"

      - name: Resolve Bundle Version And Daily Delta
        if: ${{ inputs.execute }}
        id: version
        env:
          INPUT_BUNDLE_VERSION: ${{ inputs.bundle_version || '' }}
          INPUT_REPORT_FILE: ${{ steps.plan.outputs.report_path }}
          INPUT_DAILY_DIR: ${{ steps.plan.outputs.daily_dir }}
          INPUT_DELTA_PREFIX: ${{ steps.plan.outputs.daily_delta_prefix }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          override = os.environ.get("INPUT_BUNDLE_VERSION", "").strip()
          report_file = Path(os.environ["INPUT_REPORT_FILE"])
          daily_dir = Path(os.environ["INPUT_DAILY_DIR"])
          delta_prefix = os.environ["INPUT_DELTA_PREFIX"]

          payload = json.loads(report_file.read_text(encoding="utf-8"))
          pbf_after = payload.get("pbf_after", {}) if isinstance(payload, dict) else {}
          server_after = payload.get("server_state_after", {}) if isinstance(payload, dict) else {}
          delta_export = payload.get("delta_export", {}) if isinstance(payload, dict) else {}

          ts = pbf_after.get("timestamp") or server_after.get("timestamp")
          if not ts:
              ts = datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")

          processed_date = str(ts)[:10]
          bundle_version = override or processed_date
          expected_delta_path = daily_dir / f"{delta_prefix}-{processed_date}.osc.gz"
          delta_status = str(delta_export.get("status") or "")
          diff_changed = "1" if delta_status == "exported" and expected_delta_path.exists() else "0"

          out = Path(os.environ["GITHUB_OUTPUT"])
          with out.open("a", encoding="utf-8") as f:
              f.write(f"bundle_version={bundle_version}\n")
              f.write(f"processed_date={processed_date}\n")
              f.write(f"diff_changed={diff_changed}\n")
              f.write(f"delta_path={expected_delta_path if expected_delta_path.exists() else ''}\n")

          print(f"bundle_version={bundle_version}")
          print(f"processed_date={processed_date}")
          print(f"diff_changed={diff_changed}")
          print(f"delta_path={expected_delta_path if expected_delta_path.exists() else ''}")
          PY

      - name: Fetch Previous Latest Bundle Metadata
        if: ${{ inputs.execute }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/country-prev
          release_tag="${{ steps.params.outputs.release_tag }}"

          if gh release view "${release_tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release download "${release_tag}" \
              --repo "${GITHUB_REPOSITORY}" \
              --pattern "${{ steps.plan.outputs.bundle_manifest_asset }}" \
              --pattern "${{ steps.plan.outputs.delta_index_asset }}" \
              --dir /tmp/country-prev \
              --clobber || true
          fi

      - name: Check Bundle Version Change
        if: ${{ inputs.execute }}
        id: compare
        run: |
          set -euo pipefail

          prev_manifest_tmp="/tmp/country-prev/${{ steps.plan.outputs.bundle_manifest_asset }}"
          new_version="${{ steps.version.outputs.bundle_version }}"
          diff_changed="${{ steps.version.outputs.diff_changed }}"
          force_publish="${{ steps.params.outputs.force_publish }}"

          if [[ "${force_publish}" == "true" ]]; then
            echo "needs_publish=1" >> "${GITHUB_OUTPUT}"
            echo "Force publish requested; continuing with build/release."
            exit 0
          fi

          if [[ ! -f "${prev_manifest_tmp}" ]]; then
            echo "needs_publish=1" >> "${GITHUB_OUTPUT}"
            echo "No previous bundle manifest found; publishing initial seed bundle."
            exit 0
          fi

          prev_version="$(
            python3 -c 'import json,sys; from pathlib import Path; obj=json.loads(Path(sys.argv[1]).read_text(encoding="utf-8")); print(obj.get("bundle_version") or "")' \
              "${prev_manifest_tmp}"
          )"

          if [[ "${diff_changed}" != "1" ]]; then
            if [[ -n "${prev_version}" && "${prev_version}" == "${new_version}" ]]; then
              echo "needs_publish=0" >> "${GITHUB_OUTPUT}"
              echo "No daily diff change and bundle already up to date (${new_version}); skipping build/release."
              exit 0
            fi

            echo "needs_publish=1" >> "${GITHUB_OUTPUT}"
            echo "Refreshing full bundle baseline to ${new_version} from the maintained PBF snapshot."
            exit 0
          fi

          if [[ -n "${prev_version}" && "${prev_version}" == "${new_version}" ]]; then
            echo "needs_publish=0" >> "${GITHUB_OUTPUT}"
            echo "Bundle already published for version ${new_version}; skipping build/release."
            exit 0
          fi

          echo "needs_publish=1" >> "${GITHUB_OUTPUT}"

      - name: Build v1 Artifacts And DB
        if: ${{ inputs.execute && steps.compare.outputs.needs_publish == '1' }}
        run: |
          scripts/map/build_region_artifacts.sh \
            --region "${{ steps.plan.outputs.region_slug }}" \
            --input "${{ steps.plan.outputs.input_pbf_path }}" \
            --engine pyosmium \
            --max-geom-points "${{ inputs.max_geom_points || '8' }}"

          python3 scripts/map/build_spatialite_v3.py \
            --v1-dist "mapdata/dist/${{ steps.plan.outputs.region_slug }}" \
            --out-db "mapdata/dist-v3/${{ steps.plan.outputs.region_slug }}/speeds_v3.sqlite"

      - name: Build New Incremental Delta (If Possible)
        if: ${{ inputs.execute && steps.compare.outputs.needs_publish == '1' && steps.version.outputs.diff_changed == '1' }}
        id: delta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "${{ steps.plan.outputs.bundle_dir }}" /tmp/country-prev/dbparts

          prev_manifest_tmp="/tmp/country-prev/${{ steps.plan.outputs.bundle_manifest_asset }}"
          prev_db_tmp="/tmp/country-prev/previous_bundle.sqlite"
          rm -f "${prev_db_tmp}"
          new_delta_manifest=""
          new_delta_asset_path=""

          if [[ -f "${prev_manifest_tmp}" ]]; then
            prev_version="$(
              python3 -c 'import json,sys; from pathlib import Path; obj=json.loads(Path(sys.argv[1]).read_text(encoding="utf-8")); print(obj.get("bundle_version") or "")' \
                "${prev_manifest_tmp}"
            )"
            new_version="${{ steps.version.outputs.bundle_version }}"

            if [[ -n "${prev_version}" && "${prev_version}" != "${new_version}" ]]; then
              prev_db_file="$(
                python3 -c 'import json,sys; from pathlib import Path; obj=json.loads(Path(sys.argv[1]).read_text(encoding="utf-8")); print(((obj.get("db") or {}).get("file")) or "")' \
                  "${prev_manifest_tmp}"
              )"
              prev_db_parts_json="$(
                python3 -c 'import json,sys; from pathlib import Path; obj=json.loads(Path(sys.argv[1]).read_text(encoding="utf-8")); print(json.dumps(obj.get("db_parts") or []))' \
                  "${prev_manifest_tmp}"
              )"
              prev_db_parts_count="$(
                python3 -c 'import json,sys; payload=json.loads(sys.argv[1]); print(len(payload) if isinstance(payload, list) else 0)' \
                  "${prev_db_parts_json}"
              )"

              if [[ "${prev_db_parts_count}" -gt 0 ]]; then
                if python3 scripts/map/download_db_parts.py \
                  --parts-json "${prev_db_parts_json}" \
                  --out "${prev_db_tmp}"; then
                  :
                else
                  echo "Previous db_parts download failed; skipping delta creation."
                  rm -f "${prev_db_tmp}"
                fi
              elif [[ -n "${prev_db_file}" ]]; then
                gh release download "${{ steps.params.outputs.release_tag }}" \
                  --repo "${GITHUB_REPOSITORY}" \
                  --pattern "${prev_db_file}" \
                  --dir /tmp/country-prev \
                  --clobber
                cp "/tmp/country-prev/${prev_db_file}" "${prev_db_tmp}"
              fi

              if [[ -s "${prev_db_tmp}" ]]; then
                delta_dir="${{ steps.plan.outputs.bundle_dir }}/deltas/${prev_version}_to_${new_version}"
                patch_name="${{ steps.plan.outputs.region_slug }}_${new_version}.v3_patch_from_${prev_version}.sql"
                manifest_name="${{ steps.plan.outputs.region_slug }}_${new_version}.v3_delta_manifest_from_${prev_version}.json"
                delta_input="${{ steps.version.outputs.delta_path }}"
                if [[ -z "${delta_input}" || ! -f "${delta_input}" ]]; then
                  delta_input="/tmp/country-prev/noop.osc"
                  printf '%s\n' '<osmChange version="0.6" generator="youspeed">' '</osmChange>' > "${delta_input}"
                  echo "No exported daily OSC delta found; using no-op diff input for exact DB delta generation."
                fi

                python3 scripts/map/build_v3_delta_pack.py \
                  --base-db "${prev_db_tmp}" \
                  --target-db "mapdata/dist-v3/${{ steps.plan.outputs.region_slug }}/speeds_v3.sqlite" \
                  --diff-file "${delta_input}" \
                  --region "${{ steps.plan.outputs.region_slug }}" \
                  --from-version "${prev_version}" \
                  --to-version "${new_version}" \
                  --out-dir "${delta_dir}" \
                  --patch-file-name "${patch_name}" \
                  --manifest-name "${manifest_name}" \
                  --validate-on-copy \
                  --github-owner "${GITHUB_REPOSITORY%/*}" \
                  --github-repo "${GITHUB_REPOSITORY#*/}" \
                  --github-release-tag "${{ steps.params.outputs.release_tag }}"

                new_delta_manifest="${delta_dir}/${manifest_name}"
                new_delta_asset_path="${manifest_name}"
              fi
            fi
          fi

          {
            echo "new_delta_manifest=${new_delta_manifest}"
            echo "new_delta_asset_path=${new_delta_asset_path}"
          } >> "${GITHUB_OUTPUT}"

      - name: Roll Delta Index
        if: ${{ inputs.execute && steps.compare.outputs.needs_publish == '1' }}
        run: |
          set -euo pipefail
          mkdir -p "${{ steps.plan.outputs.bundle_dir }}"
          release_base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${{ steps.params.outputs.release_tag }}"
          existing_args=()
          if [[ -f "/tmp/country-prev/${{ steps.plan.outputs.delta_index_asset }}" ]]; then
            existing_args=(--existing-index "/tmp/country-prev/${{ steps.plan.outputs.delta_index_asset }}")
          fi

          new_args=()
          if [[ -n "${{ steps.delta.outputs.new_delta_manifest }}" ]]; then
            new_args=(
              --new-delta-manifest "${{ steps.delta.outputs.new_delta_manifest }}"
              --new-delta-manifest-asset-path "${{ steps.delta.outputs.new_delta_asset_path }}"
              --release-asset-base-url "${release_base}"
            )
          fi

          python3 scripts/map/roll_v3_delta_index.py \
            --output "${{ steps.plan.outputs.bundle_dir }}/${{ steps.plan.outputs.delta_index_asset }}" \
            --retention-count "${{ inputs.retention_updates || '30' }}" \
            "${existing_args[@]}" \
            "${new_args[@]}"

      - name: Publish Latest Full Bundle Manifest
        if: ${{ inputs.execute && steps.compare.outputs.needs_publish == '1' }}
        run: |
          set -euo pipefail

          cmd=(
            python3 scripts/map/publish_v3_bundle.py
            --region "${{ steps.plan.outputs.region_slug }}"
            --country-code "${{ steps.plan.outputs.country_code }}"
            --db "mapdata/dist-v3/${{ steps.plan.outputs.region_slug }}/speeds_v3.sqlite"
            --bundle-version "${{ steps.version.outputs.bundle_version }}"
            --bundle-dir-name latest
            --out-root mapdata/bundles/v3
            --db-file-name "${{ steps.plan.outputs.bundle_db_asset }}"
            --manifest-name "${{ steps.plan.outputs.bundle_manifest_asset }}"
            --delta-index "${{ steps.plan.outputs.bundle_dir }}/${{ steps.plan.outputs.delta_index_asset }}"
            --delta-index-file-name "${{ steps.plan.outputs.delta_index_asset }}"
          )

          if [[ -f "${{ steps.plan.outputs.input_poly_path }}" ]]; then
            cmd+=(--coverage-poly "${{ steps.plan.outputs.input_poly_path }}")
          fi

          if [[ "${{ steps.params.outputs.skip_release_urls }}" != "true" ]]; then
            cmd+=(
              --github-owner "${GITHUB_REPOSITORY%/*}"
              --github-repo "${GITHUB_REPOSITORY#*/}"
              --github-release-tag "${{ steps.params.outputs.release_tag }}"
            )
          fi

          "${cmd[@]}"

      - name: Upload Latest Bundle Assets To Release
        if: ${{ inputs.execute && steps.compare.outputs.needs_publish == '1' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./scripts/map/publish_v3_release_assets.sh \
            --repo "${GITHUB_REPOSITORY}" \
            --tag "${{ steps.params.outputs.release_tag }}" \
            --bundle-dir "${{ steps.plan.outputs.bundle_dir }}" \
            --title "${{ steps.plan.outputs.bundle_release_title_default }}"

      - name: Prune Old Incremental Assets Beyond Retention
        if: ${{ inputs.execute && steps.compare.outputs.needs_publish == '1' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/map/prune_v3_release_assets.py \
            --repo "${GITHUB_REPOSITORY}" \
            --release-tag "${{ steps.params.outputs.release_tag }}" \
            --delta-index "${{ steps.plan.outputs.bundle_dir }}/${{ steps.plan.outputs.delta_index_asset }}" \
            --bundle-manifest "${{ steps.plan.outputs.bundle_dir }}/${{ steps.plan.outputs.bundle_manifest_asset }}" \
            --bundle-manifest-name "${{ steps.plan.outputs.bundle_manifest_asset }}" \
            --delta-index-name "${{ steps.plan.outputs.delta_index_asset }}" \
            --db-file-name "${{ steps.plan.outputs.bundle_db_asset }}" \
            --delta-manifest-prefix "${{ steps.plan.outputs.region_slug }}_" \
            --patch-prefix "${{ steps.plan.outputs.region_slug }}_"
