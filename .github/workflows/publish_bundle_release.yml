name: Publish Data Bundle Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "GitHub release tag (for example: germany or karlsruhe-regbez)"
        required: false
        default: "germany"
        type: string
      bundle_dir:
        description: "Bundle directory to upload"
        required: false
        default: "mapdata/bundles/v3/germany/latest"
        type: string
      release_title:
        description: "Optional release title"
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve bundle directory
        id: resolve_bundle
        run: |
          requested="${{ inputs.bundle_dir }}"
          candidates=(
            "${requested}"
            "mapdata/bundles/v3/germany/latest"
            "mapdata/bundles/v3"
          )

          resolved=""
          canonical_manifest=""
          for dir in "${candidates[@]}"; do
            if [[ ! -d "${dir}" ]]; then
              continue
            fi
            manifest_found="$(find "${dir}" -maxdepth 1 -type f -name '*_manifest.json' | head -n 1 || true)"
            if [[ -n "${manifest_found}" ]]; then
              resolved="${dir}"
              canonical_manifest="$(basename "${manifest_found}")"
              break
            fi
          done

          if [[ -z "${resolved}" ]]; then
            echo "Bundle directory missing or incomplete: ${requested}" >&2
            echo "Expected *_manifest.json in one of:" >&2
            printf ' - %s\n' "${candidates[@]}" >&2
            echo "Run workflow 'Germany Bundle Build And Release' first, then rerun this publisher." >&2
            exit 1
          fi

          echo "bundle_dir=${resolved}" >> "${GITHUB_OUTPUT}"
          echo "Using bundle directory: ${resolved}"
          find "${resolved}" -type f | head -n 40

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pretty_region="$(echo "${{ inputs.release_tag }}" | tr '_-' '  ' | awk '{for(i=1;i<=NF;i++){$i=toupper(substr($i,1,1)) substr($i,2)}; print}')"
          default_title="${pretty_region} YouSpeed Data"
          if [[ -n "${{ inputs.release_title }}" ]]; then
            ./scripts/map/publish_v3_release_assets.sh \
              --repo "${{ github.repository }}" \
              --tag "${{ inputs.release_tag }}" \
              --bundle-dir "${{ steps.resolve_bundle.outputs.bundle_dir }}" \
              --title "${{ inputs.release_title }}"
          else
            ./scripts/map/publish_v3_release_assets.sh \
              --repo "${{ github.repository }}" \
              --tag "${{ inputs.release_tag }}" \
              --bundle-dir "${{ steps.resolve_bundle.outputs.bundle_dir }}" \
              --title "${default_title}"
          fi
