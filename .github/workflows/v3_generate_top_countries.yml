name: EU Country Or Region Bundle Build

on:
  workflow_dispatch:
    inputs:
      bundle_country:
        description: "Geofabrik country id (for example: germany). Used when bundle_region is empty."
        required: false
        default: "germany"
        type: string
      bundle_region:
        description: "Optional Geofabrik region id (for example: germany/bayern). Overrides bundle_country."
        required: false
        default: ""
        type: string
      iso2:
        description: "Optional ISO2 override when bundle_region is used and index is missing ISO2"
        required: false
        default: ""
        type: string
      max_country_pbf_bytes:
        description: "Shard threshold in bytes (country PBF > threshold => child regions)"
        required: false
        default: "1000000000"
        type: string
      bundle_version:
        description: "Optional bundle version override (YYYY-MM-DD). Empty = current UTC date"
        required: false
        default: ""
        type: string
      max_geom_points:
        description: "Max sampled geometry points for preprocessing"
        required: false
        default: "8"
        type: string
      release_tag:
        description: "Release tag used for manifest URL embedding (default: <ID>)"
        required: false
        default: ""
        type: string
      skip_release_urls:
        description: "Do not embed GitHub release URLs in manifests"
        required: false
        default: true
        type: boolean
      execute:
        description: "Run full build (true) or dry-run command planning (false)"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: "1"

jobs:
  build-country-or-region:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free Runner Disk Space
        run: |
          echo "Disk before cleanup:"
          df -h
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/.ghcup || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          docker image prune -af >/dev/null 2>&1 || true
          echo "Disk after cleanup:"
          df -h

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install osmium

      - name: Build Country Or Region Bundles
        shell: bash
        run: |
          set -euo pipefail

          cmd=(
            python3 scripts/map/generate_v3_country_bundles.py
            --repo-root "$GITHUB_WORKSPACE"
            --bundle-target-config "iphone/SpeedConsumerApp/BundleTargets.top10.json"
            --max-country-pbf-bytes "${{ inputs.max_country_pbf_bytes || '1000000000' }}"
            --max-geom-points "${{ inputs.max_geom_points || '8' }}"
            --release-tag "${{ inputs.release_tag || '' }}"
          )

          if [[ -n "${{ inputs.bundle_region || '' }}" ]]; then
            cmd+=(--bundle-region "${{ inputs.bundle_region }}")
            if [[ -n "${{ inputs.iso2 || '' }}" ]]; then
              cmd+=(--iso2 "${{ inputs.iso2 }}")
            fi
          else
            cmd+=(--bundle-country "${{ inputs.bundle_country || 'germany' }}")
          fi

          if [[ -n "${{ inputs.bundle_version || '' }}" ]]; then
            cmd+=(--bundle-version "${{ inputs.bundle_version }}")
          fi

          if [[ "${{ inputs.skip_release_urls }}" == "true" ]]; then
            cmd+=(--skip-release-urls)
          fi

          if [[ "${{ inputs.execute }}" == "true" ]]; then
            cmd+=(--execute)
          fi

          printf 'Running command:\n  %q' "${cmd[0]}"
          for ((i=1; i<${#cmd[@]}; i++)); do printf ' %q' "${cmd[$i]}"; done
          printf '\n'

          "${cmd[@]}"

      - name: Publish Generated Bundle Releases
        if: ${{ inputs.execute }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          bundle_root="mapdata/bundles/v3"
          if [[ ! -d "${bundle_root}" ]]; then
            echo "Bundle root not found: ${bundle_root}" >&2
            exit 1
          fi

          shopt -s nullglob
          latest_dirs=("${bundle_root}"/*/latest)
          if [[ ${#latest_dirs[@]} -eq 0 ]]; then
            echo "No generated bundle directories found under ${bundle_root}" >&2
            exit 1
          fi

          for latest_dir in "${latest_dirs[@]}"; do
            if [[ ! -d "${latest_dir}" ]]; then
              continue
            fi
            if [[ -z "$(find "${latest_dir}" -maxdepth 1 -type f -print -quit)" ]]; then
              continue
            fi

            bundle_id="$(basename "$(dirname "${latest_dir}")")"
            pretty_region="$(BUNDLE_ID="${bundle_id}" python3 -c 'import os; raw=os.environ[\"BUNDLE_ID\"].replace(\"_\", \"-\"); print(\" \".join(p[:1].upper()+p[1:] for p in raw.split(\"-\") if p))')"
            echo "Publishing bundle_id=${bundle_id} from ${latest_dir}"
            ./scripts/map/publish_v3_release_assets.sh \
              --repo "${{ github.repository }}" \
              --tag "${bundle_id}" \
              --bundle-dir "${latest_dir}" \
              --title "${pretty_region} YouSpeed Data"
          done

      - name: Collect Generated Bundle Metadata
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mapdata/reports/top-country-run

          find mapdata/bundles/v3 -type f \( -name '*_manifest.json' -o -name '*_catalog.json' \) \
            | sort > mapdata/reports/top-country-run/generated_manifests.txt || true

          {
            echo "Generated bundle directories:"
            find mapdata/bundles/v3 -mindepth 2 -maxdepth 2 -type d | sort || true
            echo
            echo "Directory sizes:"
            du -sh mapdata/bundles/v3/* 2>/dev/null || true
          } > mapdata/reports/top-country-run/bundle_size_summary.txt

          cp mapdata/reports/europe_maxspeed_with_germany.ranking.csv mapdata/reports/top-country-run/ 2>/dev/null || true

      - name: Upload Run Metadata Artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: country-region-bundle-run-metadata
          path: |
            mapdata/reports/top-country-run/generated_manifests.txt
            mapdata/reports/top-country-run/bundle_size_summary.txt
            mapdata/reports/top-country-run/europe_maxspeed_with_germany.ranking.csv
          if-no-files-found: warn
