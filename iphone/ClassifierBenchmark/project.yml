name: ClassifierBenchmark
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.5"
    CURRENT_PROJECT_VERSION: 1
targets:
  ClassifierBenchmark:
    type: application
    platform: iOS
    sources:
      - path: ClassifierBenchmarkApp.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.youspeed.ClassifierBenchmark
        DEVELOPMENT_TEAM: F4CT29PZS5
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Classifier Bench
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_OPTIMIZATION_LEVEL: -O
        ENABLE_USER_SCRIPT_SANDBOXING: YES
schemes:
  ClassifierBenchmark:
    build:
      targets:
        ClassifierBenchmark: all
    run:
      config: Release
