name: SpeedDBBench
options:
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    CURRENT_PROJECT_VERSION: 10002
    MARKETING_VERSION: "1.0.1"
targets:
  SpeedConsumer:
    type: application
    platform: iOS
    sources:
      - path: SpeedConsumerApp
        includes:
          - "*.swift"
        excludes:
          - "SpeedConsumerTests.swift"
          - "README.md"
      - path: SpeedConsumerApp/Assets.xcassets
        buildPhase: resources
      - path: SpeedConsumerApp/de.lproj
        buildPhase: resources
      - path: SpeedConsumerApp/en.lproj
        buildPhase: resources
      - path: SpeedConsumerApp/fr.lproj
        buildPhase: resources
      - path: SpeedConsumerApp/nl.lproj
        buildPhase: resources
      - path: SpeedConsumerApp/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: SpeedConsumerApp/Rules
        buildPhase: resources
      - path: SpeedConsumerApp/legal.txt
        buildPhase: resources
      - path: SpeedConsumerApp/BundleTargets.top10.json
        buildPhase: resources
      - path: ../shared/CoveragePolys
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.youspeed.SpeedConsumer
        PRODUCT_NAME: SpeedConsumer
        INFOPLIST_FILE: SpeedConsumerApp/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-lsqlite3"
    scheme:
      testTargets:
        - SpeedConsumerTests

  SpeedDBBench:
    type: application
    platform: iOS
    sources:
      - path: SpeedDBBenchSketch
        includes:
          - "*.swift"
        excludes:
          - "SpeedDBBenchUITests.swift"
          - "SpeedDBBenchTests.swift"
          - "README.md"
      - path: SpeedConsumerApp/V3SpeedLimitService.swift
      - path: SpeedDBBenchSketch/BenchmarkAssets
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.youspeed.SpeedDBBench
        PRODUCT_NAME: SpeedDBBench
        INFOPLIST_KEY_CFBundleDisplayName: SpeedDBBench
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-lsqlite3"
    scheme:
      testTargets:
        - SpeedDBBenchTests
        - SpeedDBBenchUITests

  SpeedConsumerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SpeedConsumerApp/SpeedConsumerTests.swift
      - path: SpeedConsumerApp/TestFixtures
        buildPhase: resources
    dependencies:
      - target: SpeedConsumer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.youspeed.SpeedConsumerTests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic

  SpeedDBBenchUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: SpeedDBBenchSketch/SpeedDBBenchUITests.swift
    dependencies:
      - target: SpeedDBBench
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.youspeed.SpeedDBBenchUITests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic

  SpeedDBBenchTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SpeedDBBenchSketch/SpeedDBBenchTests.swift
    dependencies:
      - target: SpeedDBBench
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.youspeed.SpeedDBBenchTests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic

schemes:
  SpeedConsumer:
    build:
      targets:
        SpeedConsumer: all
        SpeedConsumerTests: [test]
    test:
      gatherCoverageData: false
      targets:
        - name: SpeedConsumerTests
    management:
      isShown: true
      orderHint: 0

  SpeedDBBench:
    build:
      targets:
        SpeedDBBench: all
        SpeedDBBenchTests: [test]
        SpeedDBBenchUITests: [test]
    test:
      gatherCoverageData: false
      targets:
        - name: SpeedDBBenchTests
        - name: SpeedDBBenchUITests
    management:
      isShown: true
      orderHint: 1
