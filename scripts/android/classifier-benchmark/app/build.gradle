plugins { id 'com.android.application' }

android {
    namespace 'de.youspeed.classifierbenchmark'
    compileSdk 36
    defaultConfig {
        applicationId 'de.youspeed.classifierbenchmark'
        minSdk 34
        targetSdk 36
        versionCode 1
        versionName '1.5-benchmark'
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64' }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes { debug { debuggable true } }
}

dependencies {
    implementation 'com.google.ai.edge.litert:litert:1.4.2'
    implementation 'com.google.ai.edge.litert:litert-gpu:1.4.2'
    implementation 'com.google.ai.edge.litert:litert-gpu-api:1.4.2'
}
