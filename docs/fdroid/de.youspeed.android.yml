MaintainerNotes: |-
  The source repository also contains iOS, website, and map-data tooling.
  Android is built from the android/app subdirectory and consumes shared assets
  through the app source-set configuration.

  The app contains the Apache-2.0 Vosk German speech model and the OFL-1.1
  u_DIN font. Runtime map bundles contain ODbL-1.0 OpenStreetMap-derived data.
  Downloads use hard-coded GitHub release URLs, hence NonFreeNet and
  TetheredNet.

